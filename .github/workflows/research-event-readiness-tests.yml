name: Research Event Readiness Audit Tests

on:
  push:
    branches:
      - "research/**"
    paths:
      - "tools/research/audit_pit_event_data_readiness.py"
      - "tests/test_audit_pit_event_data_readiness.py"
      - "tests/test_event_readiness_capture_workflow.py"
      - ".github/workflows/research-event-factor-capture-once.yml"
      - ".github/workflows/research-event-readiness-tests.yml"
  pull_request:
    branches:
      - research/event-factor-walk-forward
    paths:
      - "tools/research/audit_pit_event_data_readiness.py"
      - "tests/test_audit_pit_event_data_readiness.py"
      - ".github/workflows/research-event-readiness-tests.yml"

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research audit dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Compile event readiness audit and tests
        run: python -m py_compile tools/research/audit_pit_event_data_readiness.py tests/test_audit_pit_event_data_readiness.py
      - name: Run event readiness audit tests
        run: python -m pytest tests/test_audit_pit_event_data_readiness.py tests/test_event_readiness_capture_workflow.py -q
