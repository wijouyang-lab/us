name: Paper Trading

# Scan 成功后先登记信号/观察日；美股收盘后独立刷新完整 OHLCV，再处理模拟成交。
on:
  workflow_dispatch:
  schedule:
    # 20:30 UTC = 16:30 ET during DST; 21:30 UTC = 16:30 ET during standard time.
    # Runtime ET guard below skips the schedule that fires before the close.
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_run:
    workflows: ["美股盘中扫描"]
    types: [completed]

permissions:
  contents: write
  actions: read

# Share with Scan so both jobs cannot write quant_factor_price_history.csv concurrently.
concurrency:
  group: us-stock-scan
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check scheduled execution window in New York time
        id: window
        if: github.event_name == 'schedule'
        run: |
          RUN_EOD=$(python scripts/paper_trading_schedule.py | tail -n 1)
          echo "run_eod=$RUN_EOD" >> "$GITHUB_OUTPUT"
          echo "Scheduled EOD gate result: $RUN_EOD"

      - name: Install production dependencies for scheduled price refresh
        if: github.event_name == 'schedule' && steps.window.outputs.run_eod == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.txt

      - name: Refresh completed daily OHLCV before EOD simulation
        if: github.event_name == 'schedule' && steps.window.outputs.run_eod == 'true'
        run: python quant_factor_price.py

      - name: Update paper ledger
        if: github.event_name != 'schedule' || steps.window.outputs.run_eod == 'true'
        env:
          # Only a successful Scan workflow_run contributes an observation date.
          PAPER_RECORD_OBSERVATION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && '1' || '0' }}
          # Scan event queues signals; only the post-close schedule executes fills/exits.
          PAPER_EXECUTION_WINDOW: ${{ github.event_name == 'schedule' && steps.window.outputs.run_eod == 'true' && 'EOD' || 'SCAN' }}
        run: python scripts/paper_trading.py

      - name: Generate report
        if: github.event_name != 'schedule' || steps.window.outputs.run_eod == 'true'
        run: python scripts/paper_trading_report.py

      - name: Show ledger tail
        if: always()
        run: |
          if [ -f portfolio_paper_transactions.csv ]; then
            head -n 3 portfolio_paper_transactions.csv
            tail -n 5 portfolio_paper_transactions.csv
          fi

      - name: Commit and push if changed
        if: github.event_name != 'schedule' || steps.window.outputs.run_eod == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quant_factor_price_history.csv portfolio_paper_transactions.csv docs/PAPER_TRADING_REPORT.md
          if [ -f portfolio_paper_observation_dates.csv ]; then
            git add portfolio_paper_observation_dates.csv
          fi
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "chore(paper): refresh EOD prices and process simulation [skip ci]"
          if bash tools/ci/push_with_retry.sh 3 5; then
            echo "EOD prices and paper ledger pushed to main"
            exit 0
          fi
          echo "::error::push failed after retries"
          exit 1
