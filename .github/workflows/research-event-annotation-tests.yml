name: PIT event annotation queue tests

on:
  push:
    branches:
      - research/usable-event-annotation-queue
    paths:
      - "tools/research/build_event_annotation_queue.py"
      - "tests/test_build_event_annotation_queue.py"
      - ".github/workflows/research-event-annotation-tests.yml"
  pull_request:
    branches:
      - research/event-factor-walk-forward
    paths:
      - "tools/research/build_event_annotation_queue.py"
      - "tests/test_build_event_annotation_queue.py"
      - ".github/workflows/research-event-annotation-tests.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile annotation queue
        run: python -m py_compile tools/research/build_event_annotation_queue.py tests/test_build_event_annotation_queue.py
      - name: Test annotation queue
        run: python -m pytest -q tests/test_build_event_annotation_queue.py
