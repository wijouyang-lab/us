name: PIT event annotation and response tests

on:
  push:
    branches:
      - research/usable-event-annotation-queue
    paths:
      - "tools/research/build_event_annotation_queue.py"
      - "tests/test_build_event_annotation_queue.py"
      - "tools/research/apply_event_annotations.py"
      - "tests/test_apply_event_annotations.py"
      - "tools/research/pit_event_archive.py"
      - "tests/test_pit_event_archive.py"
      - "tools/research/pit_event_response_study.py"
      - "tests/test_pit_event_response_study.py"
      - ".github/workflows/research-event-annotation-tests.yml"
  pull_request:
    branches:
      - research/event-factor-walk-forward
    paths:
      - "tools/research/build_event_annotation_queue.py"
      - "tests/test_build_event_annotation_queue.py"
      - "tools/research/apply_event_annotations.py"
      - "tests/test_apply_event_annotations.py"
      - "tools/research/pit_event_archive.py"
      - "tests/test_pit_event_archive.py"
      - "tools/research/pit_event_response_study.py"
      - "tests/test_pit_event_response_study.py"
      - ".github/workflows/research-event-annotation-tests.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile PIT annotation and response tools
        run: |
          python -m py_compile \
            tools/research/build_event_annotation_queue.py \
            tools/research/apply_event_annotations.py \
            tools/research/pit_event_archive.py \
            tools/research/pit_event_response_study.py \
            tests/test_build_event_annotation_queue.py \
            tests/test_apply_event_annotations.py \
            tests/test_pit_event_archive.py \
            tests/test_pit_event_response_study.py
      - name: Test PIT annotation and response tools
        run: python -m pytest -q tests/test_build_event_annotation_queue.py tests/test_apply_event_annotations.py tests/test_pit_event_archive.py tests/test_pit_event_response_study.py
