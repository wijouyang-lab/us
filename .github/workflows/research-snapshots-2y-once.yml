name: Research Snapshots 2Y (one-shot)

on:
  workflow_dispatch:

jobs:
  snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/research/requirements-research.txt

      - name: Install deps
        run: pip install -r tools/research/requirements-research.txt

      - name: Run snapshots
        run: python tools/research/generate_research_snapshots_2y.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-snapshots-2y
          path: research_factor_snapshots_2y.csv
          retention-days: 30

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research_factor_snapshots_2y.csv
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "chore(research): generate 2Y factor snapshots"
          bash tools/ci/push_with_retry.sh 3 5
          echo "❌ push failed after 3 retries"
          exit 1
