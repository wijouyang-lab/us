name: Research Factor Dataset Audit Tests

on:
  push:
    branches:
      - research/factor-label-audit-diagnostics
    paths:
      - "tools/research/audit_formula_factor_dataset.py"
      - "tests/test_audit_formula_factor_dataset.py"
      - ".github/workflows/research-factor-audit-tests.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit test dependencies
        run: python -m pip install --upgrade pip numpy pandas pytest
      - name: Compile audit and tests
        run: python -m py_compile tools/research/audit_formula_factor_dataset.py tests/test_audit_formula_factor_dataset.py
      - name: Run dataset audit tests
        run: python -m pytest tests/test_audit_formula_factor_dataset.py -q
