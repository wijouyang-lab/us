name: Research Earnings Surprise Once

# 一次性研究：财报超预期事件驱动侦察（只读，不碰生产）
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-earnings-surprise
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-production.txt

      - name: Install deps
        run: pip install -r requirements-production.txt

      - name: Run earnings surprise recon
        run: python tools/research/earnings_surprise_recon.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earnings-surprise-recon
          path: docs/EARNINGS_SURPRISE_RECON.md
          retention-days: 30
          if-no-files-found: warn
