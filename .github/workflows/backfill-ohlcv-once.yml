name: Backfill OHLCV (one-shot)

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install yfinance pandas

      - name: Run backfill
        run: python tools/backfill/backfill_ohlcv_full.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quant_factor_price_history.csv
          if git diff --cached --quiet; then
            echo "no change to commit"
          else
            git commit -m "chore(data): backfill OHLCV from trade_history targets"
            git push
          fi
