name: Invest Terminal Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "terminal.html"
      - "terminal/**"
      - "tools/invest_terminal/**"
      - "tools/paper_trading/**"
      - "dashboard/data/invest_terminal_data.json"
      - "tests/test_invest_terminal.py"
      - "tests/test_paper_trading_platform.py"
      - ".github/workflows/research-invest-terminal.yml"
  push:
    branches: [main]
    paths:
      - "terminal.html"
      - "terminal/**"
      - "tools/invest_terminal/**"
      - "tools/paper_trading/**"
      - "dashboard/data/invest_terminal_data.json"
      - "tests/test_invest_terminal.py"
      - ".github/workflows/research-invest-terminal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas
      - name: Build terminal snapshot from existing dashboard/paper state
        run: python -m tools.invest_terminal.build_snapshot
      - name: Run integration and paper safety tests
        run: |
          python -m pytest -q tests/test_invest_terminal.py tests/test_paper_trading_platform.py
      - name: Verify no real-trading/production imports
        run: |
          test -f terminal.html
          test -f dashboard/data/invest_terminal_data.json
          ! grep -R "ib_insync\|import scan\|import review\|import evolve" tools/invest_terminal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invest-terminal-snapshot
          path: |
            dashboard/data/invest_terminal_data.json
            terminal.html
            terminal/
          retention-days: 30
          if-no-files-found: warn
