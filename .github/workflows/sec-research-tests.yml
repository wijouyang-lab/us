name: SEC research parser tests

on:
  push:
    branches:
      - research/sec-index-fallback-current
  pull_request:
    branches:
      - research/event-factor-walk-forward
    paths:
      - tools/research/sec_daily_index.py
      - tools/research/sec_master_index_capture.py
      - tests/test_sec_daily_index.py
      - tests/test_sec_master_index_capture.py
      - tests/test_sec_master_index_workflow.py
      - .github/workflows/research-event-factor-capture-once.yml
      - .github/workflows/sec-research-tests.yml

permissions:
  contents: read

jobs:
  sec-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Test SEC research parser and capture adapter
        run: python -m pytest -q tests/test_sec_daily_index.py tests/test_sec_master_index_capture.py
