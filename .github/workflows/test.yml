on:
  push:
    branches: [main, fix/quant-price-session-date-integrity]
  pull_request:
    branches: [main, research/event-factor-walk-forward]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-production.lock

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run Dividend Quality frontend tests
        if: always()
        run: node tests/test_dividend_quality_frontend.js

  dsh-install-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install and verify pinned DSH (no secrets)
        run: |
          npm ci --prefix dsh-runtime --ignore-scripts --no-audit --no-fund
          dsh-runtime/node_modules/.bin/dsh --version
          dsh-runtime/node_modules/.bin/dsh --profile headless --help >/dev/null
          test -f dsh-runtime/node_modules/@deepseek-ai/dsh-subprocess/lib/index.js
          grep -q "SENSITIVE_ENV_PATTERN" dsh-runtime/node_modules/@deepseek-ai/dsh-subprocess/lib/index.js



  dsh-subprocess-isolation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install locked DSH runtime
        run: npm ci --prefix dsh-runtime --ignore-scripts --no-audit --no-fund
      - name: Verify real DSH subprocess environment scrub
        run: node tools/automation/dsh_subprocess_probe.mjs


  dsh-process-cleanup-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-production.lock
      - name: Windows process cleanup tests
        run: python -m pytest -q tests/test_dsh_bounded_output.py
