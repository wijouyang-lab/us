name: Watchlist Brief

# 触发：
#   1) workflow_dispatch —— 手动
#   2) schedule —— 工作日收盘后（ET 16:30 ≈ UTC 20:30，夏令时）
#   3) workflow_run —— 美股盘中扫描成功后自动跑
on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * 1-5'
  workflow_run:
    workflows: ["美股盘中扫描"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: us-watchlist-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Generate watchlist brief
        run: |
          mkdir -p docs
          python scripts/build_watchlist.py > watchlist.dynamic.txt
          python scripts/ticker_brief.py --watchlist watchlist.dynamic.txt --md > docs/watchlist_brief.md
          echo "---- head ----"
          head -n 30 docs/watchlist_brief.md
          echo "---- size ----"
          wc -c docs/watchlist_brief.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/watchlist_brief.md
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "chore(c-line): refresh watchlist brief [skip ci]"
          if bash tools/ci/push_with_retry.sh 3 5; then
            echo "watchlist brief pushed to main"
            exit 0
          fi
          echo "::error::push failed after retries"
          exit 1
