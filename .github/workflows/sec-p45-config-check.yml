name: SEC P4.5 Config Check

on:
  push:
    branches:
      - research/dividend-evidence-execution-p45

permissions:
  contents: read

jobs:
  check-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check SEC user agent configuration only
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          status="$(python -m tools.investment_research.dividend.sec_filing_fetcher --check-config)"
          printf 'SEC config status: %s\n' "$status"
          if [ "$status" != "SEC_USER_AGENT_CONFIGURED" ]; then
            printf 'SEC configuration gate failed: %s\n' "$status" >&2
            exit 1
          fi
