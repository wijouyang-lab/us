name: Rebuild Quant Price History (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

# Share the Scan concurrency group so this one-off history rebuild does not race
# with the normal Scan workflow while both write quant_factor_price_history.csv.
concurrency:
  group: us-stock-scan
  cancel-in-progress: false

jobs:
  rebuild:
    # Only allow a selected workflow_dispatch on main to publish to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.txt

      - name: Record baseline
        id: baseline
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import pandas as pd

          path = Path("quant_factor_price_history.csv")
          if not path.is_file():
              raise SystemExit("Existing price history is missing; refusing an unbaselined rebuild")
          raw = path.read_bytes()
          df = pd.read_csv(path, dtype=str, keep_default_na=False)
          required = {"Date", "Ticker", "Close"}
          missing = required - set(df.columns)
          if missing or df.empty:
              raise SystemExit(f"Existing price history is invalid: missing={sorted(missing)}, rows={len(df)}")
          tickers = sorted({str(t).strip().upper() for t in df["Ticker"] if str(t).strip()})
          if not tickers:
              raise SystemExit("Existing price history has no ticker universe; refusing rebuild")
          baseline = {
              "rows": int(len(df)),
              "sha256": hashlib.sha256(raw).hexdigest(),
              "tickers": tickers,
          }
          Path(".quant_price_history_rebuild_baseline.json").write_text(
              json.dumps(baseline, sort_keys=True), encoding="utf-8"
          )
          print(f"Existing price-history rows: {baseline['rows']}")
          print(f"Existing ticker count: {len(tickers)}")
          print(f"Existing price-history SHA256: {baseline['sha256']}")
          PY

      - name: Rebuild historical OHLCV with corrected session dates
        run: python quant_factor_price.py --rebuild

      - name: Validate rebuilt price history
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd

          path = Path("quant_factor_price_history.csv")
          baseline_path = Path(".quant_price_history_rebuild_baseline.json")
          if not baseline_path.is_file():
              raise SystemExit("Rebuild baseline is missing; refusing to publish")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          if not path.is_file():
              raise SystemExit("Rebuild did not produce a price-history CSV")
          raw = path.read_bytes()
          df = pd.read_csv(path, dtype=str, keep_default_na=False)
          required = {"Date", "Ticker", "Open", "High", "Low", "Close", "Volume", "schema_version"}
          missing = required - set(df.columns)
          if missing:
              raise SystemExit(f"Missing columns: {sorted(missing)}")
          if df.empty:
              raise SystemExit("Rebuild returned zero rows; refusing to publish")
          dates = pd.to_datetime(df["Date"], errors="coerce")
          if dates.isna().any():
              samples = df.loc[dates.isna(), ["Date", "Ticker"]].head(10).to_dict("records")
              raise SystemExit(f"Invalid dates exist: {samples}")
          if (dates.dt.weekday >= 5).any():
              samples = df.loc[dates.dt.weekday >= 5, ["Date", "Ticker"]].head(10).to_dict("records")
              raise SystemExit(f"Weekend session dates remain: {samples}")
          if df.duplicated(subset=["Date", "Ticker"]).any():
              samples = df.loc[df.duplicated(subset=["Date", "Ticker"], keep=False), ["Date", "Ticker"]].head(10).to_dict("records")
              raise SystemExit(f"Duplicate Date|Ticker keys exist: {samples}")
          versions = set(df["schema_version"].astype(str))
          if versions != {"phase2b.v2"}:
              raise SystemExit(f"Unexpected schema versions after rebuild: {versions}")
          close = pd.to_numeric(df["Close"], errors="coerce")
          invalid_close = close.isna() | ~np.isfinite(close) | (close <= 0)
          if invalid_close.any():
              samples = df.loc[invalid_close, ["Date", "Ticker", "Close"]].head(10).to_dict("records")
              raise SystemExit(f"Invalid or non-positive Close prices: count={int(invalid_close.sum())}, samples={samples}")

          # A bad Open/High/Low must have been normalized to an empty field at ingestion.
          # Any remaining numeric non-positive/infinite value indicates a pipeline defect.
          for col in ("Open", "High", "Low"):
              values = pd.to_numeric(df[col], errors="coerce")
              invalid = values.notna() & (~np.isfinite(values) | (values <= 0))
              count = int(invalid.sum())
              print(f"Invalid non-positive/non-finite {col} values remaining: {count}")
              if count:
                  samples = df.loc[invalid, ["Date", "Ticker", col]].head(10).to_dict("records")
                  raise SystemExit(f"Invalid non-positive/non-finite {col}: count={count}, samples={samples}")

          open_price = pd.to_numeric(df["Open"], errors="coerce")
          open_missing = open_price.isna() | ~np.isfinite(open_price)
          open_missing_rate = float(open_missing.mean())
          if open_missing_rate > 0.01:
              examples = df.loc[open_missing, ["Date", "Ticker", "Open"]].head(10).to_dict("records")
              raise SystemExit(
                  f"More than 1% of rows lack a valid Open ({open_missing_rate:.2%}); "
                  f"count={int(open_missing.sum())}, samples={examples}"
              )

          baseline_rows = int(baseline["rows"])
          if baseline_rows > 0 and len(df) < int(baseline_rows * 0.80):
              raise SystemExit(
                  f"Row count dropped more than 20%: baseline={baseline_rows}, rebuilt={len(df)}; refusing to publish"
              )

          expected_tickers = {str(t).strip().upper() for t in baseline.get("tickers", []) if str(t).strip()}
          snapshot_path = Path("quant_factor_snapshot.csv")
          if snapshot_path.is_file():
              snapshot = pd.read_csv(snapshot_path, dtype=str, keep_default_na=False)
              if not snapshot.empty and "Ticker" not in snapshot.columns:
                  raise SystemExit("Snapshot has data but no Ticker column; cannot validate ticker universe")
              if "Ticker" in snapshot.columns:
                  expected_tickers |= {
                      str(t).strip().upper() for t in snapshot["Ticker"] if str(t).strip()
                  }
          actual_tickers = {str(t).strip().upper() for t in df["Ticker"] if str(t).strip()}
          missing_tickers = sorted(expected_tickers - actual_tickers)
          extra_tickers = sorted(actual_tickers - expected_tickers)
          if missing_tickers or extra_tickers:
              raise SystemExit(
                  f"Ticker universe mismatch: missing={missing_tickers[:30]} "
                  f"(count={len(missing_tickers)}), extra={extra_tickers[:30]} "
                  f"(count={len(extra_tickers)})"
              )

          backup_paths = sorted(glob.glob("quant_factor_price_history.csv.bak.*"))
          baseline_sha = str(baseline["sha256"])
          matching_backups = [
              name for name in backup_paths
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() == baseline_sha
          ]
          if not matching_backups:
              raise SystemExit("No pre-rebuild backup matches the exact baseline SHA256; refusing to publish")
          backup_path = matching_backups[-1]
          backup_sha = hashlib.sha256(Path(backup_path).read_bytes()).hexdigest()
          final_sha = hashlib.sha256(raw).hexdigest()

          print(
              f"Validated rows={len(df)}, baseline_rows={baseline_rows}, "
              f"tickers={len(actual_tickers)}, dates={df['Date'].nunique()}, "
              f"schema={sorted(versions)}"
          )
          print(f"Historical ticker set: exact match ({len(expected_tickers)} tickers)")
          print(f"Baseline SHA256: {baseline_sha}")
          print(f"Backup path: {backup_path}")
          print(f"Backup SHA256: {backup_sha}")
          print(f"Rebuilt CSV SHA256: {final_sha}")
          PY

      - name: Upload pre-rebuild backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-price-history-pre-rebuild-backup-${{ github.run_id }}
          path: quant_factor_price_history.csv.bak.*
          if-no-files-found: warn
          retention-days: 30

      - name: Commit and push corrected history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quant_factor_price_history.csv
          if git diff --cached --quiet; then
            echo "Corrected history is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "fix(quant): rebuild price history with correct session dates"
          if bash tools/ci/push_with_retry.sh 3 5; then
            echo "Corrected price history pushed to main"
            exit 0
          fi
          echo "::error::Could not publish corrected price history after retries; backup artifact is retained"
          exit 1
