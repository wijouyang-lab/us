name: QQQ TRANSITION Web Paper

# Independent simulated account. No broker connection, no order transmission.
on:
  workflow_dispatch:
  schedule:
    # 21:45 UTC is after the regular US close in both DST and standard time.
    - cron: "45 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: qqq-transition-web-paper
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.txt

      - name: Refresh QQQ/SPY/BIL with append-only provenance
        run: python scripts/update_qqq_transition_data.py

      - name: Rebuild deterministic simulated ledger
        run: python scripts/qqq_transition_paper.py

      - name: Update prospective account if explicitly started
        run: python -m scripts.qqq_transition_prospective update-prospective

      - name: Show account summary
        run: |
          python - <<'PY'
          import json
          d = json.load(open("dashboard/data/qqq_transition_paper.json"))
          print({k: d[k] for k in ("nav", "return_pct", "status", "data_asof", "counts")})
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qqq_transition_paper dashboard/data/qqq_transition_paper.json dashboard/data/qqq_transition_paper_prospective.json data/research/qqq_transition_paper
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(qqq-paper): refresh simulated account [skip ci]"
            git push
          fi
