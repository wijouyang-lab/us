name: 美股盘中扫描

on:
  # 由**外部定时任务**通过 workflow_dispatch 触发（外部调度器已覆盖定时，避免 GitHub
  # 自带 schedule 与外部触发重复占用并发额度）。
  # 下游 paper-trading.yml / watchlist-brief.yml 使用 workflow_run: types [completed]，
  # 对 workflow_dispatch 触发的 completed 事件同样生效 ✓。
  workflow_dispatch:

# 防重复：同一时间只允许一个 Scan 在执行/排队。
# cancel-in-progress: false —— 已有 Scan 正在跑时，新触发排队等待，绝不取消正在跑的那个。
concurrency:
  group: us-stock-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'   # ← 升级到这里

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.txt

      - name: 配置Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: 运行美股盘中扫描
        env:
          TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
          EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
          CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
          CLAWSOCKET_LIVE_MODEL: claude-fable-5-1
          ENABLE_TARGET_FILE: "1"
          ENABLE_SCAN_BUY_DECISION: ${{ vars.ENABLE_SCAN_BUY_DECISION }}
          ENABLE_MACRO_PANEL: ${{ vars.ENABLE_MACRO_PANEL }}
        run: python scan.py

      # 买入决策前置到 scan（flag 门控，默认关闭）：repo variable 不存在 → 步骤跳过 → 走旧路径。
      # 仅执行买入决策（--buy-only 跳过 process_sells）；账本后续由 review 的 --no-buy 接管。
      # continue-on-error：即便失败也不阻断 scan 主流程与数据落盘。
      - name: Scan buy decision (flag-gated)
        if: env.ENABLE_SCAN_BUY_DECISION == '1'
        run: python portfolio_50000.py --buy-only --data-dir .
        continue-on-error: true

      # Quant Research 价格历史层：扫描成功后，为 Factor Snapshot 的历史 ticker
      # 批量更新 quant_factor_price_history.csv（幂等 upsert，绝不逐股重复请求）。
      - name: 更新 Quant 价格历史
        run: python quant_factor_price.py

      # 安全网：即使后面 git push 失败，本轮生成的 pending CSV、AI 文本与 AI Snapshot
      # 也不会随 runner 销毁而丢失（ai_snapshot.csv 按 Ticker|Rec_Date|Tag 永久保存，丢失不可重建）
      - name: 上传扫描产物（防止推送失败导致数据丢失）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-output-${{ github.run_id }}
          path: |
            us_stocks_pending_*.csv
            ai_text_cache.csv
            ai_snapshot.csv
            option_strategies.csv
            quant_factor_snapshot.csv
            quant_factor_price_history.csv
          if-no-files-found: warn

      - name: 提交待确认文件、AI 文本缓存与 AI Snapshot
        run: |
          # AI 文本缓存必须随 scan 一并入库：云端 dashboard_export.py 靠它回填六段
          if [ -f ai_text_cache.csv ]; then
            git add ai_text_cache.csv
          fi
          # AI Snapshot 必须入库：它是 Review 历史 AI 的唯一合法来源（按 Ticker|Rec_Date|Tag）
          # 只在文件存在时 add；不存在时不能让 workflow 失败
          if [ -f ai_snapshot.csv ]; then
            git add ai_snapshot.csv
          fi
          # 期权策略账本：scan.py 经 scan_us_option_engine 生成；必须入库，否则 Runner 销毁后丢失
          if [ -f option_strategies.csv ]; then
            git add option_strategies.csv
          fi
          # Quant Factor Lab 每日因子快照：研究数据层，随 Scan 一并入库
          if [ -f quant_factor_snapshot.csv ]; then
            git add quant_factor_snapshot.csv
          fi
          # Quant Research 价格历史层：为 Forward Return 提供真实历史价格
          if [ -f quant_factor_price_history.csv ]; then
            git add quant_factor_price_history.csv
          fi
          if ls us_stocks_pending_*.csv 1> /dev/null 2>&1; then
            git add us_stocks_pending_*.csv
          fi

          # AI 目标持仓：scan 在 ENABLE_TARGET_FILE=1 时落盘 portfolio_50000_target.csv；
          # 必须随 scan 一并入库，否则文件永远停在 runner 工作区、到不了 main（dashboard 无法读取）。
          if [ -f portfolio_50000_target.csv ]; then
            git add portfolio_50000_target.csv
          fi

          # 美股宏观板块：scan 在 ENABLE_MACRO_PANEL=1 时落盘 macro_data.json；
          # 必须随 scan 一并入库，否则文件到不了 main（dashboard_export 无法读取）。
          if [ -f macro_data.json ]; then
            git add macro_data.json
          fi

          # 每日候选因子快照（只记录，供未来因子分析）。
          if [ -f candidate_factor_snapshots.csv ]; then
            git add candidate_factor_snapshots.csv
          fi

          # 运行时模型使用记录：clawsocket_compat.write_model_usage() 在 scan 结束时落盘
          # dashboard/data/model_usage.json（记录中转站实际返回的 upstream_model）。
          # 必须随 scan 一并入库，否则 dashboard_export 读不到、前端 runtime 条不显示模型名。
          if [ -f dashboard/data/model_usage.json ]; then
            git add dashboard/data/model_usage.json
          fi

          # $50,000 账本：仅当 scan 通过 ENABLE_SCAN_BUY_DECISION=1 接管买入决策时，
          # --buy-only 会改写这些账本文件，必须随 scan 一并提交，否则 review 的 --no-buy
          # 在独立 runner 里 git pull 到的是旧账本 → scan 做的买入丢失。
          # 关闭时 vars 为空 → 条件为假 → 不执行 → 与现在逐字节一致。
          if [ "${{ vars.ENABLE_SCAN_BUY_DECISION }}" = "1" ]; then
            git add portfolio_50000_positions.csv portfolio_50000_transactions.csv portfolio_50000_history.csv portfolio_50000_meta.json
            # 成交时刻侧车（买入几点几分）随账本一起入库，Dashboard 才有时刻可显示
            if [ -f portfolio_50000_txn_time.csv ]; then git add portfolio_50000_txn_time.csv; fi
          fi

          if git diff --cached --quiet; then
            echo "⚠️ 无可提交变更（无 pending 文件且缓存无更新）"
            exit 0
          fi

          git commit -m "chore: persist scan pending and AI snapshots"

          # ------------------------------------------------------------------
          # rebase 前先把"未纳入本次提交"的工作区变更挪走。
          # scan.py 运行时还会改写 option_strategies.csv / scan_version.txt 并生成
          # __pycache__/*.pyc，这些不在上面的 git add 清单里。若不清理，git rebase 会直接
          # 报 "cannot rebase: You have unstaged changes." 而拒绝执行 —— 本次提交的数据
          # 就永远推不上去。（2026-09-28 run 36432062414 就是死在这里）
          # 用 stash 而不是 checkout -- .：不破坏任何文件，且 -u 连未跟踪的 pyc 一起收走。
          # ------------------------------------------------------------------
          if [ -n "$(git status --porcelain)" ]; then
            echo "ℹ️ 工作区仍有未纳入本次提交的变更，先 stash（不删除任何文件）："
            git status --porcelain
            git stash push --keep-index -u -m "scan-uncommitted-leftovers" || true
          fi

          # 并发安全推送：必须先 fetch + rebase 到最新 origin/main，再推送
          # 绝对禁止 git push --force / -f：绝不覆盖远端 main
          if bash tools/ci/push_with_retry.sh 5 5; then
            echo "Scan 数据已推送到 main"
            exit 0
          fi

          echo "::error::Scan 数据无法推送到 main（已重试 5 次）"
          git status --porcelain
          exit 1

  # 新闻抓取：scan job 成功后才跑（每天 1 次，与当日 scan 结果同步）。
  # needs: scan —— scan 失败时本 job 被自动跳过，不会抓到"昨日持仓"的新闻。
  # secrets: inherit —— 透传 FINNHUB_API_KEY / CLAWSOCKET_API_KEY / CLAWSOCKET_BASE_URL。
  news:
    needs: scan
    uses: ./.github/workflows/news-fetch.yml
    secrets: inherit

  # Quant Research（Phase 2-7）：scan 成功后才跑（每天 1 次）。
  # needs: scan —— scan 失败时本 job 被自动跳过；由 scan 顺带喂出 quant_factor_snapshot.csv 等。
  # workflow_call —— 取消原 cron TBD（注释态永不触发），改为由 scan 链式驱动；
  # 仍保留 workflow_dispatch 支持手动触发。secrets: inherit 透传全局密钥。
  quant-research:
    needs: scan
    uses: ./.github/workflows/quant-research.yml
    secrets: inherit
