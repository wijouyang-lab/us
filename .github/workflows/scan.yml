name: 美股盘中扫描

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install pandas pandas-ta yfinance anthropic requests lxml html5lib

      - name: 配置Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: 运行美股盘中扫描
        env:
          TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
          EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
          CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
        run: python scan.py

      - name: 提交待确认文件
        run: |
          if ls us_stocks_pending_*.csv 1> /dev/null 2>&1; then
            git add us_stocks_pending_*.csv
            git commit -m "chore: 美股盘中待确认 $(date +%Y-%m-%d)"
            git push
            echo "✅ 美股待确认文件已提交"
          else
            echo "⚠️ 未生成美股待确认文件"
          fi
