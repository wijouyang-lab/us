name: US-Share Scan

on:
  workflow_dispatch: # 完美保留：既支持你网页手动补刀，又完美支持腾讯云 API 远程精准打击

jobs:
  run-scan:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Libs
      # 移除了 tushare，新增了 yfinance, lxml 和 html5lib
      run: pip install pandas pandas-ta requests anthropic yfinance lxml html5lib

    - name: Run Scan
      env:
        # 移除了失效的 TUSHARE_TOKEN
        CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
        CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
        EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
      run: python scan.py

    - name: Save Logs
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "Alpha Bot"
        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto update US logs"
        git push
