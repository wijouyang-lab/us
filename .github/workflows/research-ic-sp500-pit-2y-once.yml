name: Research IC S&P500 PIT 2Y (one-shot)

on:
  workflow_dispatch:

jobs:
  ic:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/research/requirements-research.txt

      - name: Install deps
        run: pip install -r tools/research/requirements-research.txt

      - name: Run IC
        run: python tools/research/run_research_ic_sp500_pit_2y.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-ic-sp500-pit-2y
          path: |
            research_backtest_sp500_pit_2y.csv
            research_summary_sp500_pit_2y.csv
            research_ic_sp500_pit_2y.csv
          retention-days: 30

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f research_backtest_sp500_pit_2y.csv ]; then git add research_backtest_sp500_pit_2y.csv; fi
          if [ -f research_summary_sp500_pit_2y.csv ]; then git add research_summary_sp500_pit_2y.csv; fi
          if [ -f research_ic_sp500_pit_2y.csv ]; then git add research_ic_sp500_pit_2y.csv; fi
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "chore(research): IC analysis S&P500 PIT 2Y"
          bash tools/ci/push_with_retry.sh 3 5
