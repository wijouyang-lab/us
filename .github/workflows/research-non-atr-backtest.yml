name: Research Non-ATR Historical Backtest
on:
  push:
    branches:
      - "research/non-atr-integrated-backtest"
    paths:
      - ".github/workflows/research-non-atr-backtest.yml"
      - "tools/research/non_atr_integrated_backtest.py"
      - "tools/research/non_atr_strategy_baselines.py"
      - "tools/research/non_atr_validation.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/non-atr-integrated-backtest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install "pandas>=2.2,<4" "numpy>=1.26,<3"
      - name: Confirm required research inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              "research_price_history_sp500_10y.csv",
              "research_spy_sp500_10y.csv",
              "tools/research/data/sp500_components_history.csv",
              "tools/research/data/sp500_ticker_aliases.csv",
              "tools/research/data/nasdaq100_membership_history.csv",
              "tools/research/data/dow30_membership_history.csv",
          ]
          for value in paths:
              path = Path(value)
              if not path.is_file():
                  raise SystemExit(f"Missing required input: {value}")
              print(f"{value}: {path.stat().st_size} bytes")
          PY
      - name: Run PIT-complete history backtest
        run: |
          python -m tools.research.non_atr_integrated_backtest \
            --input research_price_history_sp500_10y.csv \
            --output-dir research_non_atr_backtest_results \
            --spy-calendar research_spy_sp500_10y.csv \
            --sp500-membership tools/research/data/sp500_components_history.csv \
            --ticker-aliases tools/research/data/sp500_ticker_aliases.csv \
            --nasdaq100-membership tools/research/data/nasdaq100_membership_history.csv \
            --dow30-membership tools/research/data/dow30_membership_history.csv \
            --min-rows 756 --min-train-rows 756 --test-rows 252 \
            --one-way-cost-bps 5
      - name: Upload research results even if analysis fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-non-atr-backtest-results
          path: research_non_atr_backtest_results/
          if-no-files-found: warn
          retention-days: 30
