name: Research Event Factor Capture (manual)

on:
  workflow_dispatch:
  push:
    branches:
      - research/event-factor-walk-forward
    paths:
      - .github/workflows/research-event-factor-capture-once.yml

permissions:
  contents: write

concurrency:
  group: research-event-factor-capture
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/research/event-factor-walk-forward'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/research/requirements-research.txt

      - name: Install research dependencies
        run: pip install -r tools/research/requirements-research.txt

      - name: Capture official macro, policy, speech and Treasury auction RSS
        env:
          OFFICIAL_FEED_USER_AGENT: "wijouyang-lab/us research collector (contact: 288002660+wijouyang-lab@users.noreply.github.com)"
        shell: bash
        run: |
          set -euo pipefail
          DECISION_AT="$(python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"))')"
          python -m tools.research.run_event_capture_cycle \
            --output-dir data/research/event-capture \
            --decision-at "$DECISION_AT" \
            --audit-after-capture

      - name: Capture official Treasury nominal and real curves
        shell: bash
        run: |
          set -euo pipefail
          YEAR="$(date -u +%Y)"
          python -m tools.research.treasury_yield_curve_capture \
            --year "$YEAR" \
            --output "data/research/event-capture/treasury_nominal_${GITHUB_RUN_ID}.json"
          python -m tools.research.treasury_yield_curve_capture \
            --year "$YEAR" --curve-type real \
            --output "data/research/event-capture/treasury_real_${GITHUB_RUN_ID}.json"

      - name: Commit immutable capture and updated event archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/research/event-capture
          if git diff --cached --quiet; then
            echo "No research capture changes to commit."
            exit 0
          fi
          git commit -m "research: capture official event and Treasury data run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase "origin/$GITHUB_REF_NAME"; then
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 5
          done
          echo "::error::Unable to push capture to the selected research branch; main was not targeted."
          exit 1

      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-factor-capture-${{ github.run_id }}
          path: data/research/event-capture/
          retention-days: 90
          if-no-files-found: warn
