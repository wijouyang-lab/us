name: DSH Headless Task

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Stable task id (e.g. p12-4-3-audit)"
        required: true
        type: string
      prompt:
        description: "Task prompt for DSH headless"
        required: true
        type: string
      branch:
        description: "Research branch (feature/fix/research/automation only)"
        required: true
        type: string
      base_branch:
        description: "Explicit PR base branch"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Run DSH but do not commit/push/PR"
        required: true
        default: true
        type: boolean
      max_attempts:
        description: "Maximum automatic attempts (1-3)"
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3"]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: dsh-task-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate inputs and main protection
        env:
          TASK_ID: ${{ inputs.task_id }}
          TASK_BRANCH: ${{ inputs.branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.automation.preflight --task-id "$TASK_ID" --branch "$TASK_BRANCH" --base-branch "$BASE_BRANCH"

  agent:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned DSH and verify
        run: |
          npm install --prefix .dsh-runtime --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2
          .dsh-runtime/node_modules/.bin/dsh --version
          echo "$PWD/.dsh-runtime/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install project test dependencies
        run: python -m pip install -r requirements-production.txt
      - name: DSH agent (no GitHub write token)
        env:
          TASK_ID: ${{ inputs.task_id }}
          TASK_PROMPT: ${{ inputs.prompt }}
          TASK_BRANCH: ${{ inputs.branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m tools.automation.agent_task             --task-id "$TASK_ID" --prompt "$TASK_PROMPT"             --branch "$TASK_BRANCH" --base-branch "$BASE_BRANCH"             --out agent-artifact --log automation/logs/agent.ndjson
      - name: Upload DSH log (artifact only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-log-${{ inputs.task_id }}-${{ github.run_id }}
          path: automation/logs/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload agent artifact for Publisher
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-artifact
          path: agent-artifact/
          if-no-files-found: error
          retention-days: 7

  publisher:
    needs: agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: agent-artifact
          path: agent-artifact
      - name: Configure git and branch
        env:
          TASK_BRANCH: ${{ inputs.branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "dsh-publisher[bot]"
          git config user.email "dsh-publisher[bot]@users.noreply.github.com"
          git fetch origin "$BASE_BRANCH" "$TASK_BRANCH" || true
          git switch "$TASK_BRANCH" 2>/dev/null || git switch -c "$TASK_BRANCH" "origin/$BASE_BRANCH"
      - name: Publish validated artifact and Draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_ID: ${{ inputs.task_id }}
        run: python -m tools.automation.publisher --artifact agent-artifact
      - name: Draft PR only - no auto-merge
        run: echo "PR is draft-only; merging is intentionally disabled; human authorization is required."
