name: DSH Headless Task

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Stable task id (e.g. p12-4-3-audit)"
        required: true
        type: string
      prompt:
        description: "Task prompt for DSH headless"
        required: true
        type: string
      branch:
        description: "Research branch (must not be main)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Run DSH but do not commit/push/PR"
        required: true
        default: true
        type: boolean
      max_attempts:
        description: "Maximum automatic attempts (1-3)"
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3"]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: dsh-task-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  dsh-task:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned DSH
        run: npm install --global @deepseek-ai/dsh@0.2.0-rc.2

      - name: Guard - never run on main
        run: |
          test "${{ inputs.branch }}" != "main"
          test "${{ inputs.branch }}" != ""

      - name: Configure git
        run: |
          git config user.name "dsh-automation[bot]"
          git config user.email "dsh-automation[bot]@users.noreply.github.com"

      - name: Run DSH task
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_CMD: ${{ vars.CODEX_CMD }}
        run: |
          python -m tools.automation.run_task \
            --task-id "${{ inputs.task_id }}" \
            --prompt "${{ inputs.prompt }}" \
            --branch "${{ inputs.branch }}" \
            --max-attempts "${{ inputs.max_attempts }}" \
            $( [ "${{ inputs.dry_run }}" = "true" ] && echo "--dry-run" )

      - name: Upload run log and state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-${{ inputs.task_id }}-${{ github.run_id }}
          path: |
            automation/logs/
            automation/state/
          if-no-files-found: warn
          retention-days: 14

      - name: Persist state on task branch (never main)
        if: always() && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f automation/state/tasks.json ]; then
            git add automation/state automation/logs
            if ! git diff --cached --quiet; then
              git commit -m "chore(dsh): persist state for ${{ inputs.task_id }} [skip ci]"
              git push origin HEAD:"${{ inputs.branch }}"
            fi
          fi

      - name: Draft PR only - no auto-merge
        run: echo "PR is draft-only; merging is intentionally disabled; human authorization is required."
