name: DSH Headless Task

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Stable task id (e.g. p12-4-3-audit)"
        required: true
        type: string
      prompt:
        description: "Task prompt for DSH headless"
        required: true
        type: string
      branch:
        description: "Research branch (feature/fix/research/automation only)"
        required: true
        type: string
      base_branch:
        description: "Explicit PR base branch"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Run DSH but do not commit/push/PR"
        required: true
        default: true
        type: boolean
      max_attempts:
        description: "Maximum automatic attempts (1-3)"
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3"]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: dsh-task-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  dsh-task:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned DSH
        run: npm install --global @deepseek-ai/dsh@0.2.0-rc.2

      - name: Configure git
        run: |
          git config user.name "dsh-automation[bot]"
          git config user.email "dsh-automation[bot]@users.noreply.github.com"

      - name: Run DSH task
        env:
          TASK_ID: ${{ inputs.task_id }}
          TASK_PROMPT: ${{ inputs.prompt }}
          TASK_BRANCH: ${{ inputs.branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m tools.automation.run_task --task-id "$TASK_ID" --prompt "$TASK_PROMPT" --branch "$TASK_BRANCH" --base-branch "$BASE_BRANCH" --max-attempts "$MAX_ATTEMPTS" --dry-run
          else
            python -m tools.automation.run_task --task-id "$TASK_ID" --prompt "$TASK_PROMPT" --branch "$TASK_BRANCH" --base-branch "$BASE_BRANCH" --max-attempts "$MAX_ATTEMPTS"
          fi

      - name: Upload run log and state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-${{ inputs.task_id }}-${{ github.run_id }}
          path: |
            automation/logs/
            automation/state/
          if-no-files-found: warn
          retention-days: 14

      - name: Persist state only (never logs, never main)
        if: always() && inputs.dry_run == false
        env:
          TASK_BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f automation/state/tasks.json ]; then
            git add automation/state/tasks.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(dsh): persist state for ${TASK_BRANCH} [skip ci]"
              git push origin HEAD:"${TASK_BRANCH}"
            fi
          fi

      - name: Draft PR only - no auto-merge
        run: echo "PR is draft-only; merging is intentionally disabled; human authorization is required."
