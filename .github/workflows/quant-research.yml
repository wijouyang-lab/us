name: Quant Research (Phase 2-7)

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: us-stock-derived-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-production.txt

      - name: Guard - require snapshot
        id: guard
        run: |
          if [ ! -f quant_factor_snapshot.csv ]; then
            echo "snapshot 不存在，跳过（不报错、不落空文件）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run research pipeline
        if: steps.guard.outputs.skip != 'true'
        run: python quant_research_runner.py

      # 独立的 ATR 风险平价研究：报告正确区分单期平均收益/累计复利，并扣除显式往返成本假设。
      - name: Recalculate cost-aware ATR position-sizing report
        if: steps.guard.outputs.skip != 'true'
        run: python tools/research/atr_position_sizing.py

      # PIT sector history / Market_Cap are mandatory; script writes an explicit skipped status
      # rather than using current sector membership or log(Price) as a size proxy.
      - name: Recalculate turnover-cost and attribution audit
        if: steps.guard.outputs.skip != 'true'
        run: python tools/research/turnover_and_cost_analysis.py

      # P0-2 门禁（方案 ②）：runner 默认 exit_code=0，因为 NOT_ENOUGH_DATA（数据未就绪 /
      # SHADOW_ENABLE 未开启）属预期状态；但真实 Phase 异常会写入 overall_status=FAILED。
      # 这里只对 FAILED 失败，既能让 scipy 这类真实故障变红，又不把预期状态误判为失败。
      - name: Fail if overall_status is FAILED
        if: steps.guard.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json, sys
          with open("quant_research_status.json", encoding="utf-8") as fh:
              st = (json.load(fh) or {}).get("overall_status")
          print(f"[gate] quant_research_status.overall_status={st}")
          if st == "FAILED":
              print("::error::Quant research pipeline reported FAILED (Phase exception)")
              sys.exit(1)
          PY

      - name: Commit research artifacts
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 显式列出 Phase 2-7 研究产物（不用 git add -A，避免把 __pycache__/无关文件带进 main）。
          # 仅在文件存在时 add；不存在的（如某 Phase 未产出）不强行 add，避免 git add 报错中断。
          add_research() {
            for f in \
              quant_factor_backtest.csv \
              quant_factor_summary.csv \
              quant_factor_validation.csv \
              quant_factor_correlation.csv \
              quant_factor_validation_report.json \
              quant_walk_forward_results.csv \
              quant_walk_forward_summary.json \
              quant_shadow_snapshot.csv \
              quant_shadow_performance.csv \
              quant_shadow_report.json \
              quant_production_approval.json \
              quant_production_config.json \
              quant_production_state.json \
              quant_research_status.json \
              docs/ATR_POSITION_SIZING.md \
              docs/DEATH_AUTOPSY.md ; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
          }

          add_research
          if git diff --cached --quiet; then
            echo "研究产物无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(quant): refresh phase 2-7 research artifacts [skip ci]"

          # 并发安全推送：quant-research 经 scan.yml needs:scan 触发，启动时本地 main 落后于
          # 已 push 的 scan 提交，直接 push 必被 non-fast-forward 拒绝。每次重试先 fetch +
          # reset --soft 重建提交到最新 origin/main 之上，绝不 force push（同款 news-fetch 模式）。
          PUSHED=0
          if bash tools/ci/push_with_retry.sh 3 5; then
            echo "quant 数据已推送到 main"
            exit 0
          fi
          if [ "$PUSHED" = "1" ]; then
            echo "Quant 研究产物已提交并推送"
          else
            echo "::error::重试 3 次后仍无法推送；本轮已生成数据保留在工作区，未回退未覆盖远端"
            exit 1
          fi
