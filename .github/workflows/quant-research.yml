name: Quant Research (Phase 2-7)

on:
  workflow_dispatch:
  workflow_call:

# 独立并发组，不与 scan / dashboard-data 抢占
concurrency:
  group: quant-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Guard - require snapshot
        id: guard
        run: |
          if [ ! -f quant_factor_snapshot.csv ]; then
            echo "snapshot 不存在，跳过（不报错、不落空文件）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run research pipeline
        if: steps.guard.outputs.skip != 'true'
        run: python quant_research_runner.py

      - name: Commit research artifacts
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(quant): refresh phase 2-7 research artifacts [skip ci]"
          git push
