name: Formula Factor Extended Technical Research (PIT, research only)

on:
  workflow_dispatch:
  push:
    branches:
      - research/extended-technical-factor-screen
    paths:
      - ".github/workflows/formula-factor-extended-technical-research.yml"
      - "tools/research/run_formula_factor_validation.py"
      - "tests/test_formula_factor_temporal_features.py"
      - "tests/test_formula_factor_validation.py"
      - "tools/research/formula_factor_discovery.py"
      - "tools/research/aggregate_formula_factor_reports.py"
      - "tests/test_formula_factor_report_aggregation.py"
      - "research_backtest_sp500_pit_2y.csv"

permissions:
  contents: read

concurrency:
  group: formula-factor-extended-technical-research
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research test dependencies
        run: python -m pip install --upgrade pytest numpy pandas scipy
      - name: Compile temporal-factor and aggregation tools
        run: python -m py_compile tools/research/run_formula_factor_validation.py tools/research/aggregate_formula_factor_reports.py tests/test_formula_factor_temporal_features.py tests/test_formula_factor_validation.py tests/test_formula_factor_report_aggregation.py
      - name: Test temporal factors and research reports
        run: python -m pytest -q tests/test_formula_factor_temporal_features.py tests/test_formula_factor_validation.py tests/test_formula_factor_report_aggregation.py

  evaluate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: core_plus_volume_zscore
            factor_columns: "ATR_Pct,Realized_Volatility_20D_Pct,Momentum_5D_Pct,Momentum_20D_Pct,Momentum_60D_Pct,RSI,MA20_Slope_Pct_5D,Beta_60D_SPY,Volume_Ratio_20D,ZScore_20D"
          - family: relative_strength_and_oscillators
            factor_columns: "ATR_Pct,Realized_Volatility_20D_Pct,Momentum_20D_Pct,Stock_RS_20D_vs_SPY,MA20,MA50,乖离率(%),MACD_HIST_LAST,KDJ_J,量比"
          - family: temporal_signal_dynamics
            factor_columns: "ATR_Pct,Realized_Volatility_20D_Pct,Momentum_20D_Pct,Stock_RS_20D_vs_SPY,RSI,Momentum_20D_Acceleration_20_Snapshots,RSI_Change_5_Snapshots,ATR_Pct_Change_20_Snapshots"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy
      - name: Check tracked PIT dataset
        run: test -s research_backtest_sp500_pit_2y.csv
      - name: Evaluate bounded formula family
        run: |
          python tools/research/run_formula_factor_validation.py \
            --input research_backtest_sp500_pit_2y.csv \
            --output-dir "formula-factor-results-${{ matrix.family }}" \
            --max-base-factors 10 \
            --factor-columns "${{ matrix.factor_columns }}" \
            --cost-bps 5 \
            --min-names 10
      - name: Upload family results
        uses: actions/upload-artifact@v4
        with:
          name: formula-factor-extended-${{ matrix.family }}-${{ github.run_id }}
          path: "formula-factor-results-${{ matrix.family }}/"
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all factor-family results
        uses: actions/download-artifact@v4
        with:
          pattern: formula-factor-extended-*-${{ github.run_id }}
          path: formula-factor-inputs
          merge-multiple: false
      - name: Aggregate unique candidates and correct across families
        run: |
          python -m tools.research.aggregate_formula_factor_reports \
            --reports-dir formula-factor-inputs \
            --output-dir formula-factor-extended-aggregate
      - name: Upload joint adjusted results
        uses: actions/upload-artifact@v4
        with:
          name: formula-factor-extended-aggregate-${{ github.run_id }}
          path: formula-factor-extended-aggregate/
          if-no-files-found: error
          retention-days: 90
