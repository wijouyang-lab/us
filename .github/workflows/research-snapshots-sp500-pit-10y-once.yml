name: Research Snapshots + IC S&P500 PIT 10Y (one-shot)

on:
  workflow_dispatch:
  # Intentional rerun: merge a change to this workflow with [run-10y-research] in the commit title.
  # One-time bootstrap: allow the specially marked merge commit to launch the long PIT run.
  push:
    paths:
      - '.github/workflows/research-snapshots-sp500-pit-10y-once.yml'
      - 'tools/research/refresh_sp500_pit_prices.py'
      - 'tools/research/pit_membership.py'
      - 'tools/research/generate_research_snapshots_sp500_pit_10y.py'
      - 'tools/research/data/sp500_components_history.csv'
      - 'tools/research/data/sp500_ticker_aliases.csv'

jobs:
  snapshots:
    # Pushes only launch this job when the commit explicitly carries the one-time trigger marker.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-10y-research]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/research/requirements-research.txt

      - name: Install deps
        run: pip install -r tools/research/requirements-research.txt

      - name: Calculate rolling ten-year analysis start
        id: period
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, time, timedelta
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York"))
          cutoff = now.date() if now.time() >= time(16, 0) else now.date() - timedelta(days=1)
          try:
              start = cutoff.replace(year=cutoff.year - 10)
          except ValueError:
              start = cutoff.replace(year=cutoff.year - 10, day=28)
          print(f"analysis_start={start.isoformat()}")
          PY

      - name: Refresh raw OHLC and adjusted return prices for PIT constituents
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: |
          python tools/research/refresh_sp500_pit_prices.py \
            --analysis-start "${{ steps.period.outputs.analysis_start }}" \
            --history tools/research/data/sp500_components_history.csv \
            --aliases tools/research/data/sp500_ticker_aliases.csv

      - name: Run snapshots on validated ten-year window
        run: |
          python tools/research/generate_research_snapshots_sp500_pit_10y.py \
            --analysis-start "${{ steps.period.outputs.analysis_start }}"

      - name: Run IC
        run: python tools/research/run_research_ic_sp500_pit_10y.py

      # Isolated low-frequency ATR strategy validation on the 10Y PIT forward-return dataset.
      # This is research-only and does not modify production scores, Scan, stops, or ledgers.
      - name: Run low-frequency ATR strategy validation
        run: |
          python tools/research/low_frequency_atr_strategy.py \
            --input research_backtest_sp500_pit_10y.csv \
            --output LOW_FREQUENCY_ATR_STRATEGY_10Y.md

      # Independent execution-timing check: signal known after prior close, entry at Scan_Date Open.
      # Reports the refreshed adjusted-price basis and historical membership caveats.
      - name: Run next-open ATR execution validation
        run: |
          python tools/research/low_frequency_atr_execution_validation.py \
            --snapshot research_factor_snapshots_sp500_pit_10y.csv \
            --prices research_price_history_sp500_10y.csv \
            --constituents tools/research/data/sp500_components_history.csv \
            --output LOW_FREQUENCY_ATR_EXECUTION_10Y.md

      - name: Upload price-refresh audit on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pit-price-refresh-audit-${{ github.run_id }}
          path: research_pit_price_refresh_audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: research-snapshots-ic-sp500-pit-10y
          path: |
            research_price_history_sp500_10y.csv
            research_spy_sp500_10y.csv
            research_pit_price_refresh_audit.json
            tools/research/data/sp500_components_history.csv
            tools/research/data/sp500_ticker_aliases.csv
            research_factor_snapshots_sp500_pit_10y.csv
            research_backtest_sp500_pit_10y.csv
            research_summary_sp500_pit_10y.csv
            research_ic_sp500_pit_10y.csv
            LOW_FREQUENCY_ATR_STRATEGY_10Y.md
            LOW_FREQUENCY_ATR_EXECUTION_10Y.md
          if-no-files-found: warn
          retention-days: 30

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f research_ic_sp500_pit_10y.csv ]; then git add research_ic_sp500_pit_10y.csv; fi
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "chore(research): IC analysis S&P500 PIT 10Y"
          bash tools/ci/push_with_retry.sh 3 5
