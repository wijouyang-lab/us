name: _temp-acceleration
on:
  push:
    paths: ['.github/workflows/_temp-acceleration.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-production.txt
      - name: Fetch history
        run: python _temp_experiment/fetch_history.py
      - name: Build snapshot
        run: python _temp_experiment/build_factor_snapshot.py
      - name: Run backtest
        run: python _temp_experiment/run_backtest.py
      - name: Run validation
        run: python _temp_experiment/run_validation.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceleration-results
          path: _temp_experiment/*.json
          retention-days: 7
