name: Formula Factor Empirical Research (PIT, research only)

on:
  workflow_dispatch:
  push:
    branches:
      - research/event-factor-walk-forward
    paths:
      - .github/workflows/formula-factor-empirical-research.yml
      - tools/research/run_formula_factor_validation.py
      - tools/research/formula_factor_discovery.py
      - tests/test_formula_factor_validation.py

permissions:
  contents: read

concurrency:
  group: formula-factor-empirical-research
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch and tracked point-in-time dataset
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy

      - name: Check tracked PIT dataset exists
        shell: bash
        run: |
          set -euo pipefail
          test -s research_backtest_sp500_pit_2y.csv
          echo "Dataset bytes: $(wc -c < research_backtest_sp500_pit_2y.csv)"
          head -n 1 research_backtest_sp500_pit_2y.csv

      - name: Evaluate bounded formula family on PIT history
        run: |
          python tools/research/run_formula_factor_validation.py \
            --input research_backtest_sp500_pit_2y.csv \
            --output-dir formula-factor-results \
            --max-base-factors 8 \
            --factor-columns ATR_Pct,Realized_Volatility_20D_Pct,Momentum_5D_Pct,Momentum_20D_Pct,Momentum_60D_Pct,RSI,MA20_Slope_Pct_5D,Beta_60D_SPY \
            --cost-bps 5 \
            --min-names 10

      - name: Upload complete exploratory results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formula-factor-pit-results-${{ github.run_id }}
          path: formula-factor-results/
          if-no-files-found: warn
          retention-days: 90
