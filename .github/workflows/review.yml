name: 美股盘后复盘

on:
  workflow_dispatch:
  schedule:
    # Schedule: UTC (GitHub 原生 cron 只认 UTC，不依赖 timezone 字段)
    # Review: Tue-Sat 06:00 Beijing = Mon-Fri 22:00 UTC
    - cron: '23 22 * * 1-5'

# 与 dashboard-data 同 concurrency group，串行排队防账本覆盖；与 scan 独立。
concurrency:
  group: us-stock-portfolio-ledger
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 拉取最新代码
        run: git pull origin main --ff-only

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'   # ← 同步升级，保持一致

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.txt

      - name: 配置Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: 运行美股盘后复盘
        env:
          TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
          EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
          CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
          CLAWSOCKET_LIVE_MODEL: claude-fable-5-1
          ENABLE_AI_REASON_BACKFILL: "1"
        run: python review.py

      # $50,000 长期模拟投资组合：只读取 trade_history 的推荐与 Review 裁决，
      # 不重新实现止损；账本由 portfolio_50000.py 确定性维护并幂等落盘。
      # 买入决策已前置到 scan（flag 门控）时，review 跳过 process_buys（--no-buy）；
      # flag 未设（默认）→ 走 else 分支，与改动前逐字节一致。
      - name: 更新 $50,000 Portfolio Ledger
        if: hashFiles('.review_session_ready') != '' && hashFiles('.review_session_skipped') == ''
        env:
          ENABLE_STOP_LOSS_SYNC: "1"
        run: |
          if [ "${{ vars.ENABLE_SCAN_BUY_DECISION }}" = "1" ]; then
            python portfolio_50000.py --no-buy --data-dir .
          else
            python portfolio_50000.py --data-dir .
          fi

      # 成功标记必须在 review.py 业务落盘 + portfolio 账本步骤都成功后才写。
      # 任一步失败 -> 无标记 -> 下一次同 session 重跑；新 pending 会改变指纹，不会被误跳过。
      - name: 写入 Review 交易日成功标记
        if: hashFiles('.review_session_ready') != '' && hashFiles('.review_session_skipped') == ''
        run: python review_session_guard.py mark --session "$(cat .review_session_ready)"

      # 安全网：即使后面 git push 失败，本轮复盘产物也不会随 runner 销毁而丢失
      - name: 上传复盘产物（防止推送失败导致数据丢失）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-output-${{ github.run_id }}
          path: |
            trade_history.csv
            review_history.csv
            option_strategies.csv
            review_report.html
            us_stocks_pending_*.csv
            us_stocks_pending_*.csv.processed
            portfolio_50000_meta.json
            portfolio_50000_positions.csv
            portfolio_50000_transactions.csv
            portfolio_50000_history.csv
            portfolio_50000_txn_time.csv
            review_session_state.json
          if-no-files-found: warn

      - name: 提交账本和处理记录
        if: hashFiles('.review_session_ready') != '' && hashFiles('.review_session_skipped') == ''
        run: |
          # 只 add 明确需要持久化的业务文件，绝不 git add -A
          git add trade_history.csv review_history.csv

          # 交易日成功标记：随业务数据一起入库；push 失败时下次会重新执行
          if [ -f review_session_state.json ]; then
            git add review_session_state.json
          fi

          # $50,000 Portfolio Ledger：必须随复盘一并入库，否则账户状态会丢失
          if [ -f portfolio_50000_meta.json ]; then
            git add portfolio_50000_meta.json
            git add portfolio_50000_positions.csv
            git add portfolio_50000_transactions.csv
            git add portfolio_50000_history.csv
          fi

          # 成交时刻侧车：Dashboard 用它显示买入/卖出几点几分与持有时间；
          # 必须持久化，否则每次 checkout 都丢失历史时刻（缺失时文件不存在，跳过）
          if [ -f portfolio_50000_txn_time.csv ]; then
            git add portfolio_50000_txn_time.csv
          fi

          # review.py 平仓时会改写期权账本，必须入库
          if [ -f option_strategies.csv ]; then
            git add option_strategies.csv
          fi

          if ls us_stocks_pending_*.csv.processed 1> /dev/null 2>&1; then
            git add us_stocks_pending_*.csv.processed
          fi

          # 运行时模型使用记录：review 结束时落盘 dashboard/data/model_usage.json
          # （只更新自己的 review 键，scan 的记录不会被覆盖）。必须入库，否则前端不显示模型名。
          if [ -f dashboard/data/model_usage.json ]; then
            git add dashboard/data/model_usage.json
          fi

          # review.py 消费过的 pending 原文件（未 .processed）从工作区移除，避免下一轮重复入账
          # 注意：这会把 rename 表达为删除；push_with_retry.sh 的 pending-guard（参数 1）
          # 会在 origin/main 上的 Pending 已被 Scan 更新/新增时拒绝 push，避免 rebase 静默丢行。
          git rm -f us_stocks_pending_*.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "⚠️ 无可提交变更"
            exit 0
          fi

          git commit -m "chore: 美股盘后补充成交 $(date +%Y-%m-%d)"

          # ------------------------------------------------------------------
          # rebase 前先把"未纳入本次提交"的工作区变更挪走。
          # review.py 运行时会生成 __pycache__/*.pyc 等未跟踪文件；若不清理，
          # git rebase 会报 "cannot rebase: You have unstaged changes." 而拒绝执行。
          # 用 stash 而不是 checkout -- .：不破坏任何文件，-u 连未跟踪文件一起收走。
          # 若 stash 失败必须停止，绝不掩盖错误、绝不删除任何业务数据。
          # ------------------------------------------------------------------
          if [ -n "$(git status --porcelain)" ]; then
            echo "ℹ️ 工作区仍有未纳入本次提交的变更，先 stash（不删除任何文件）："
            git status --porcelain
            if ! git stash push -u -m "review-uncommitted-leftovers"; then
              echo "::error::git stash 失败，停止推送（不掩盖错误，不删除任何业务数据）"
              exit 1
            fi
          fi

          # 并发安全推送：必须先 fetch + rebase 到最新 origin/main，再推送
          # 绝对禁止 git push --force / -f：绝不覆盖远端 main
          if bash tools/ci/push_with_retry.sh 5 5 1; then
            echo "复盘数据已推送到 main"
            exit 0
          fi

          echo "::error::复盘数据无法推送到 main（已重试 5 次）"
          git status --porcelain
          exit 1
