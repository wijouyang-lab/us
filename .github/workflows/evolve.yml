name: US-Share Evolve
on:
  workflow_dispatch:
  schedule:
    # Schedule: UTC (GitHub 原生 cron 只认 UTC，不依赖 timezone 字段)
    # Evolution: First Saturday of each month 10:00 Beijing = 02:00 UTC
    - cron: '37 2 * * 6'

jobs:
  run-scan:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 定时触发控制：只有「北京时间每月第一个星期六」才执行 Evolution。
    # schedule 的 cron '0 2 * * 6'（UTC）每周六 02:00 UTC = 北京时间 10:00 触发，
    # 但仅在本月第一个星期六（day-of-month <= 7）继续；其余星期六跳过，不执行 Evolution 业务。
    # 手动 workflow_dispatch 不受此限制，始终执行（便于人工随时运行）。
    - name: Check first Saturday of month (Beijing time)
      id: check-date
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "schedule" ]; then
          # 北京时间：day-of-week (1=Mon .. 6=Sat .. 7=Sun) 与 day-of-month
          BJ_DOW=$(TZ=Asia/Shanghai date '+%u')
          BJ_DAY=$(TZ=Asia/Shanghai date '+%d')
          if [ "$BJ_DOW" = "6" ] && [ "$BJ_DAY" -le 7 ]; then
            SHOULD_RUN=true
          else
            SHOULD_RUN=false
          fi
        else
          # 手动 workflow_dispatch：不受每月第一个星期六限制，直接执行
          SHOULD_RUN=true
        fi
        echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
        echo "event=${{ github.event_name }} | Beijing $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %A') | day-of-month=$(TZ=Asia/Shanghai date '+%d') | dow=$(TZ=Asia/Shanghai date '+%u') | should_run=$SHOULD_RUN"
        if [ "$SHOULD_RUN" != "true" ]; then
          echo "Skip: schedule trigger but not the first Saturday of the month, Evolution will not run."
        else
          echo "Run: proceeding with Evolution."
        fi

    - name: Setup Python
      if: steps.check-date.outputs.should_run == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Libs
      if: steps.check-date.outputs.should_run == 'true'
      run: python -m pip install -r requirements-production.txt

    - name: Run Evolve
      if: steps.check-date.outputs.should_run == 'true'
      env:
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
        CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
        EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
      run: python evolve.py || true

    - name: Save Logs
      if: steps.check-date.outputs.should_run == 'true'
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "Alpha Bot"
        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto evolve US"
        git push
