name: US-Share Evolve
on:
  workflow_dispatch:
  schedule:
    # Schedule: UTC (GitHub 原生 cron 只认 UTC，不依赖 timezone 字段)
    # Evolution: Monthly on the 1st of each month 02:00 UTC（2026-10-08 判决：由首周六改为每月1号）
    - cron: '0 2 1 * *'

jobs:
  run-scan:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 定时触发控制（2026-10-08 判决）：每月 1 号 02:00 UTC 执行 Evolution。
    # cron 已限定 day-of-month=1，无需再判断「首周六」；Schedule 触发即运行。
    # 手动 workflow_dispatch 同样始终执行（便于人工随时运行）。
    - name: Check monthly run on the 1st (UTC)
      id: check-date
      shell: bash
      run: |
        # cron '0 2 1 * *' 已保证仅每月 1 号触发；无需周六/日期二次门控。
        SHOULD_RUN=true
        echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
        echo "event=${{ github.event_name }} | UTC $(date -u '+%Y-%m-%d %H:%M:%S %A') | should_run=$SHOULD_RUN"
        echo "Run: proceeding with Evolution (monthly on the 1st)."

    - name: Setup Python
      if: steps.check-date.outputs.should_run == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Libs
      if: steps.check-date.outputs.should_run == 'true'
      run: python -m pip install -r requirements-production.txt

    - name: Run Evolve
      if: steps.check-date.outputs.should_run == 'true'
      env:
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
        CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
        CLAWSOCKET_LIVE_MODEL: claude-fable-5-1
        EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
      run: python evolve.py

    - name: Save Logs
      if: steps.check-date.outputs.should_run == 'true'
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "Alpha Bot"

        # Evolve has a narrow output contract. Never stage the entire runner
        # workspace: generated caches or unrelated files must not be swept into
        # a monthly strategy commit.
        for f in \
          strategy_params.json \
          strategy_evolution.json \
          evolved_rules.json \
          dashboard/data/model_usage.json ; do
          if [ -f "$f" ]; then
            git add -- "$f"
          fi
        done

        # Defense in depth: stop if anything outside the allowlist was staged.
        STAGED="$(git diff --cached --name-only)"
        if [ -z "$STAGED" ]; then
          echo "Evolve 无已授权产物变化，跳过提交"
          exit 0
        fi
        while IFS= read -r f; do
          case "$f" in
            strategy_params.json|strategy_evolution.json|evolved_rules.json|dashboard/data/model_usage.json)
              ;;
            *)
              echo "::error::Evolve staged an unexpected path: $f"
              exit 1
              ;;
          esac
        done <<< "$STAGED"

        git commit -m "chore(evolve): persist approved evolution outputs"
        if bash tools/ci/push_with_retry.sh 3 5; then
          echo "Evolve outputs safely pushed to main"
          exit 0
        fi
        echo "::error::Evolve outputs could not be pushed after retries"
        exit 1
