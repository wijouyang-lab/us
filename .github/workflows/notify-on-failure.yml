name: Notify on Workflow Failure

on:
  workflow_run:
    workflows:
      - "美股盘中扫描"
      - "美股盘后复盘"
      - "Quant Research (Phase 2-7)"
      - "US-Share Evolve"
      - "news-fetch"
      - "skill-weekly"
      - "Test"
      - "Backfill OHLCV (one-shot)"
      - "Research Backfill 2Y (one-shot)"
      - "Research Backfill S&P500 2Y (one-shot)"
      - "Research Backfill S&P500 10Y (one-shot)"
      - "Research Snapshots 2Y (one-shot)"
      - "Research Snapshots S&P500 2Y (one-shot)"
      - "Research Snapshots S&P500 PIT 2Y (one-shot)"
      - "Research Snapshots + IC S&P500 PIT 10Y (one-shot)"
      - "Research IC 2Y (one-shot)"
      - "Research IC S&P500 2Y (one-shot)"
      - "Research IC S&P500 PIT 2Y (one-shot)"
    types:
      - completed

permissions:
  issues: write
  actions: read

concurrency:
  group: notify-on-failure
  cancel-in-progress: true

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `[CI Failure] ${run.name} #${run.run_number}`;
            const body = [
              `**Workflow**: ${run.name}`,
              `**Run**: [#${run.run_number}](${run.html_url})`,
              `**Triggered by**: ${run.event}`,
              `**Branch**: ${run.head_branch}`,
              `**SHA**: \`${run.head_sha.slice(0, 8)}\``,
              `**Time**: ${run.created_at}`,
              ``,
              `请检查失败日志：[点击查看](${run.html_url})`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['ci-failure'],
            });
