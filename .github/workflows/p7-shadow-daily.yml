name: P7 Shadow Daily

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p7-shadow-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests yfinance pytest
      - name: Refresh shadow and benchmarks
        run: |
          python -m tools.investment_research.p7.shadow_portfolio --refresh
          python -m tools.investment_research.p7.benchmark
      - name: Run P7 tests
        run: python -m pytest -q tests/test_p7_strategy.py tests/test_p7_1_shadow.py
      - uses: actions/upload-artifact@v4
        with:
          name: p7-shadow-daily
          path: data/universe/p7/
          retention-days: 30
          if-no-files-found: error
