name: P7 Shadow Daily

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Research branch to update
        required: true
        default: research/invest-terminal-v1

permissions:
  contents: write

concurrency:
  group: p7-shadow-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests yfinance pytest
      - name: Refresh shadow and benchmarks
        run: |
          python -m tools.investment_research.p7.shadow_portfolio --refresh
          python -m tools.investment_research.p7.benchmark
          python -m tools.invest_terminal.build_snapshot
      - name: Run P7 tests
        run: python -m pytest -q tests/test_p7_strategy.py tests/test_p7_1_shadow.py
      - name: Persist P7 research data
        run: |
          git config user.name "p7-shadow-bot"
          git config user.email "p7-shadow-bot@users.noreply.github.com"
          git add data/universe/p7 dashboard/data/invest_terminal_data.json
          if git diff --cached --quiet; then
            echo "No P7 changes"
          else
            git commit -m "chore: update P7 research shadow"
            git push origin HEAD:${{ github.event.inputs.branch }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: p7-shadow-daily
          path: |
            data/universe/p7/
            dashboard/data/invest_terminal_data.json
          retention-days: 30
          if-no-files-found: error
