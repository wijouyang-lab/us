name: Research Event Capture

# Research-only capture. Manual plus one weekday post-close scheduled run.
on:
  workflow_dispatch:
    inputs:
      feeds:
        description: "Comma-separated official feed keys"
        required: false
        default: "bls_cpi,bls_employment,fed_all,fed_speeches"
  schedule:
    - cron: "15 21 * * 1-5"

permissions:
  contents: read

concurrency:
  group: research-event-archive
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-production.txt

      - name: Capture official feeds
        id: capture
        env:
          # Optional override; the collector has an honest project default UA.
          OFFICIAL_FEED_USER_AGENT: ${{ secrets.OFFICIAL_FEED_USER_AGENT }}
          FEEDS: ${{ github.event.inputs.feeds }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          out="docs/research/event_forward_runs/${stamp}"
          decision="$(date -u -d '+10 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          python -m tools.research.run_event_capture_cycle \
            --output-dir "$out" \
            --decision-at "$decision" \
            --feeds "$FEEDS"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "## Research event capture" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts: $out" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist cumulative archive branch
        env:
          CAPTURE_DIR: ${{ steps.capture.outputs.out }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          archive_branch="research/event-archive"
          archive_dir="$RUNNER_TEMP/event-archive"
          if git ls-remote --exit-code --heads origin "$archive_branch" >/dev/null 2>&1; then
            git fetch origin "$archive_branch:refs/remotes/origin/$archive_branch"
            git worktree add --detach "$archive_dir" "origin/$archive_branch"
          else
            git worktree add --detach "$archive_dir" HEAD
            cd "$archive_dir"
            git checkout --orphan "$archive_branch"
            git rm -rf .
          fi
          cd "$archive_dir"
          python -m tools.research.event_archive_store import \
            --store "$archive_dir" \
            --snapshot "$GITHUB_WORKSPACE/$CAPTURE_DIR" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$RUN_URL" \
            --commit-sha "$GITHUB_SHA"
          python -m tools.research.event_archive_store verify --store "$archive_dir"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No archive changes for run $GITHUB_RUN_ID"
            exit 0
          fi
          git commit -m "event archive: run ${GITHUB_RUN_ID}"
          git push origin "HEAD:${archive_branch}"

      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-event-capture-${{ github.run_id }}
          path: docs/research/event_forward_runs/
          if-no-files-found: error
          retention-days: 90
