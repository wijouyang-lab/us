name: news-fetch

on:
  workflow_dispatch:
  # TEMP-VERIFY：临时 push 触发，只为立即验证模型切换后的翻译，验证完立刻移除。
  # paths 过滤保证只有“本文件自身变化”才跑，不会被 dashboard-data 的每 15 分钟提交反复触发。
  push:
    paths:
      - '.github/workflows/news-fetch.yml'
  schedule:
    # Schedule: UTC（GitHub 原生 cron 只认 UTC）
    # TBD：判决后填写，避开 dashboard-data 的 */15 网格与 scan/review 高峰。
    # 推荐：工作日每 2 小时 23 分 → 23 */2 * * 1-5（北京时间 07:23 / 09:23 / ... / 23:23）
    - cron: '23 */2 * * 1-5'

# 独立并发组：不与 scan / review / dashboard-data / evolve 抢占
concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        # 抓取脚本仅用标准库；沿用仓库既有依赖清单（dashboard_export 同款）保持一致
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-production.txt

      - name: 抓取 Finnhub 新闻
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
          CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
          CLAWSOCKET_LIVE_MODEL: claude-opus-5-5
        run: python dashboard/fetch_news.py

      - name: TEMP-DIAG 用真实标题跑真实 translate_headlines（临时，验证完删除）
        env:
          CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
          CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
          CLAWSOCKET_LIVE_MODEL: claude-opus-5-5
        run: |
          python3 - <<'PY'
          import os, sys, json, time
          sys.path.insert(0, os.getcwd())
          import dashboard.fetch_news as fn
          from clawsocket_compat import ClawSocketClient

          def ann(level, title, msg):
              safe = str(msg).replace("%", "%25").replace("\r", "").replace("\n", " ")[:700]
              print(f"::{level} title={title}::{safe}")

          ann("notice", "DIAG_MODEL_CONST", f"TRANSLATE_MODEL={fn.TRANSLATE_MODEL} live_env={os.environ.get('CLAWSOCKET_LIVE_MODEL')}")

          d = json.load(open("dashboard/data/news_data.json", encoding="utf-8"))
          pos = fn.read_position_tickers(fn.POSITIONS_PATH_DEFAULT)
          ann("notice", "DIAG_POSITIONS", f"pos={pos}")
          heads = [x.get("headline") for x in d.get("market_news", [])[:10]]
          for tk in pos:
              heads += [x.get("headline") for x in d.get("ticker_news", {}).get(tk, [])[:5]]
          heads = list(dict.fromkeys([h for h in heads if h]))
          ann("notice", "DIAG_HEADS", f"n={len(heads)} first={heads[0][:60]!r}")

          # 1) 走真实生产函数（R1 吞异常）
          t0 = time.time()
          res = fn.translate_headlines(heads)
          ann("notice", "DIAG_TR_RESULT",
              f"{time.time()-t0:.1f}s returned={len(res)} sample={list(res.items())[:1]}")

          # 2) 绕过 R1，直接看原始返回 + 解析
          t0 = time.time()
          try:
              c = ClawSocketClient(timeout=150, retries=1)
              resp = c.messages.create(model=fn.TRANSLATE_MODEL, max_tokens=4000,
                                       messages=[{"role": "user", "content": fn._build_translation_prompt(heads)}])
              txt = getattr(resp, "output_text", "") or ""
              arr = fn._extract_json_array(txt)
              ann("notice", "DIAG_RAW",
                  f"{time.time()-t0:.1f}s used={c.last_model_used} proto={c.last_protocol} "
                  f"fallback={c.last_model_fallback} len={len(txt)} "
                  f"arr={'None' if arr is None else 'len=%d' % len(arr)}")
              ann("notice", "DIAG_RAW_HEAD", repr(txt[:300]))
              ann("notice", "DIAG_RAW_TAIL", repr(txt[-300:]))
          except Exception as e:
              ann("error", "DIAG_RAW", f"{time.time()-t0:.1f}s FAIL {type(e).__name__}: {str(e)[:250]}")
          PY

      - name: 提交新闻数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/news_data.json
          # [skip ci] 防止提交触发其它 CI；无变化则跳过提交
          git diff --cached --quiet || git commit -m "chore(dashboard): refresh news data [skip ci]"
          # 与 dashboard-data 并发撞车时的重试（同款模式）：
          #   · 先 fetch 最新 origin/main，绝不用陈旧远端基准
          #   · reset --soft 让本轮已生成数据重新成为工作区改动，提交到最新 main 之上
          #   · 不 force push
          PUSHED=0
          for i in 1 2 3; do
            if git push origin main; then
              PUSHED=1
              break
            fi
            echo "::warning::push 被拒绝（疑似并发提交），基于最新 origin/main 重建提交后重试 ($i/3)"
            git fetch origin main
            git reset --soft FETCH_HEAD
            git reset HEAD
            git add dashboard/data/news_data.json
            if git diff --cached --quiet; then
              echo "远端数据已与本轮一致，无需重复提交"
              PUSHED=1
              break
            fi
            git commit -m "chore(dashboard): refresh news data [skip ci]"
          done
          if [ "$PUSHED" = "1" ]; then
            echo "新闻数据已提交并推送"
          else
            echo "::error::重试 3 次后仍无法推送；本轮已生成数据保留在工作区，未回退未覆盖远端"
            exit 1
          fi
