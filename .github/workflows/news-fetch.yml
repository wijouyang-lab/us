name: news-fetch

on:
  workflow_call:        # 由 scan.yml 的 news job 在 scan 成功后调用（每天 1 次）
  workflow_dispatch:    # 保留手动入口
  # schedule 已移除：新闻抓取改为「等 scan 成功后才跑」，由 scan.yml 以
  # needs: scan + uses: ./.github/workflows/news-fetch.yml 触发。
  # 好处：新闻与当日 scan 结果同步（持仓联动读的是当天持仓），且不会与
  # dashboard-data 的每 15 分钟提交反复撞车。

# 并发组：被 scan 调用时继承 scan 的 context；手动触发时保护并发
concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        # 抓取脚本仅用标准库；沿用仓库既有依赖清单（dashboard_export 同款）保持一致
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-production.txt

      - name: 抓取 Finnhub 新闻
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
          CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
          CLAWSOCKET_LIVE_MODEL: claude-opus-5-5
        run: python dashboard/fetch_news.py

      - name: 提交新闻数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/news_data.json
          # [skip ci] 防止提交触发其它 CI；无变化则跳过提交
          git diff --cached --quiet || git commit -m "chore(dashboard): refresh news data [skip ci]"
          # 与 dashboard-data 并发撞车时的重试（同款模式）：
          #   · 先 fetch 最新 origin/main，绝不用陈旧远端基准
          #   · reset --soft 让本轮已生成数据重新成为工作区改动，提交到最新 main 之上
          #   · 不 force push
          PUSHED=0
          for i in 1 2 3; do
            if git push origin main; then
              PUSHED=1
              break
            fi
            echo "::warning::push 被拒绝（疑似并发提交），基于最新 origin/main 重建提交后重试 ($i/3)"
            git fetch origin main
            git reset --soft FETCH_HEAD
            git reset HEAD
            git add dashboard/data/news_data.json
            if git diff --cached --quiet; then
              echo "远端数据已与本轮一致，无需重复提交"
              PUSHED=1
              break
            fi
            git commit -m "chore(dashboard): refresh news data [skip ci]"
          done
          if [ "$PUSHED" = "1" ]; then
            echo "新闻数据已提交并推送"
          else
            echo "::error::重试 3 次后仍无法推送；本轮已生成数据保留在工作区，未回退未覆盖远端"
            exit 1
          fi
