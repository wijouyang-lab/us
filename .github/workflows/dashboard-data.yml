name: Dashboard Data Refresh

# Dashboard 数据刷新 + 组合价格快照 + 盘中模拟止损检查。
# 该 workflow 必须只在 main 分支上运行：其 push 步骤会将生成的数据推回 main。
# 不运行 scan.py / review.py / options 逻辑；止损仅写入模拟组合 CSV，不下券商订单。
# 不调用 AI API、不硬编码行情数值。

on:
  schedule:
    # 工作日每 15 分钟刷新；GitHub cron 可能延迟或漏跑，不能作为真实交易止损保证。
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
    inputs:
      kline_bars:
        description: "K 线保留的完整交易日数量"
        required: false
        default: "180"
      no_stooq:
        description: "禁用 Stooq 备用源（true/false）"
        required: false
        default: "false"
  push:
    # Critical safety guard: this workflow pushes generated files to main.
    # Never run it from PR/feature branches.
    branches: [main]
    paths:
      - dashboard_export.py
      - dashboard/fetch_runtimes.py
      - dashboard/summarize_run.py
      - .github/workflows/dashboard-data.yml
  workflow_run:
    # Refresh the public dashboard as soon as the externally-triggered Scan
    # finishes successfully. This does not trigger Scan or make an AI call.
    workflows: ["美股盘中扫描"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  # dashboard-data 会对同一批数据文件做「生成 → commit → push」。
  # cancel-in-progress: true 会让已进入 push 阶段的 run 被后一个 run 取消，
  # 前一个 run 已生成但尚未提交的数据随之丢失（run #951 即此情形）。
  # 改为 false：后到的 run 排队等待，保证同一时刻只有一个 run 操作 main 分支。
  group: us-stock-portfolio-ledger
  cancel-in-progress: false

jobs:
  refresh:
    # Keep the workflow main-only. When invoked by workflow_run, only refresh
    # after a successful Scan run on main; failed/cancelled Scan runs do nothing.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 明确声明：本 Workflow 与 AI 无关，仅作审计留痕
      DASHBOARD_AI_ENABLED: "false"
      # fetch_runtimes.py 读取 scan/review/evolve 最近成功 run（只读 actions:read）
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # 与 scan.yml 一致：开启后 dashboard_export 才会读 portfolio_50000_target.csv
      # 并注入 portfolio.target，前端「AI 目标持仓」板块才可见（scan 已落盘该文件）。
      ENABLE_TARGET_FILE: "1"
      # 市场情绪指标（F&G + FedWatch）：默认不设 → 步骤被 if: 跳过，dashboard 输出与现在逐字节一致。
      # 激活方式：在仓库 Settings → Secrets and variables → Actions → Variables 新增
      # ENABLE_MARKET_INDICATORS=1。
      ENABLE_MARKET_INDICATORS: ${{ vars.ENABLE_MARKET_INDICATORS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ! python -m pip install -r requirements-production.txt; then
            echo "::warning::依赖安装失败，dashboard_export.py 将自动降级到内置 HTTP / Stooq 源"
          fi
          python -c "import yfinance,sys;print('yfinance', yfinance.__version__)" \
            || echo "::warning::yfinance 不可用，将使用 Yahoo HTTP / Stooq 降级路径"

      - name: Fetch workflow runtimes
        run: |
          # 读取 scan/review/evolve 最近一次成功 run 的时间与 head_sha（只读，绝不覆盖成功时间）
          python dashboard/fetch_runtimes.py > dashboard/data/runtimes.json
          cat dashboard/data/runtimes.json

      - name: Refresh portfolio prices
        # 每 15 分钟刷新持仓价格快照；这不代表实时行情保证。
        # continue-on-error：即使本步骤失败，也不拖垮整体 dashboard 刷新。
        env:
          ENABLE_STOP_LOSS_SYNC: "1"
        run: python portfolio_50000.py --price-only --data-dir .
        continue-on-error: true

      - name: Intraday stop loss check
        # 预期每 15 分钟检查；只使用时间戳新鲜的 5 分钟常规时段 bar。
        # 仅更新模拟账本，不是券商下单；任务延迟/数据过旧会 fail closed。
        run: python portfolio_50000.py --intraday-stop --data-dir .
        continue-on-error: true

      - name: Install openai SDK (oversold AI)
        # ai_router 的 ClawSocket 路径依赖 openai SDK；requirements-production 未包含，
        # 单独补装。装不上不影响规则候选，AI 字段会缺失并显示 pending。
        run: python -m pip install "openai>=1.0,<3"
        continue-on-error: true

      - name: Screen + AI analyze oversold candidates
        # 规则筛选 → yfinance 补板块/基本面/新闻 → 板块上限 2 → AI 三维解读。
        # 不修改 quant_* 研究文件、不产生交易；无密钥/模型失败时仍写出规则候选。
        # timeout-minutes：yfinance / AI 单点卡住时不让整轮刷新挂死（超时该步失败，
        # 后续仍用旧候选文件继续导出）。
        run: python scripts/oversold_ai.py
        continue-on-error: true
        timeout-minutes: 12
        env:
          CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
          CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
          GPT_MODEL: deepseek-flash

      - name: Fetch macro indicators (9 items)
        # FRED + ISM + EIA；逐项 fail-closed（拿不到写 null），只写 macro_indicators.json。
        run: python dashboard/fetch_macro_indicators.py
        continue-on-error: true
        timeout-minutes: 10

      - name: CPI expected-diff AI (only on change)
        # 只有 CPI/核心CPI 的期间/预期/实际变化时才调用 AI；signature 相同直接跳过。
        run: python dashboard/macro_cpi_ai.py
        continue-on-error: true
        timeout-minutes: 5
        env:
          CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
          CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
          GPT_MODEL: deepseek-flash

      - name: Translate news headlines (cache + AI)
        # 只翻译缓存里没有的新标题（每次最多 40 条）；无密钥时只套缓存、不清空。
        run: python dashboard/translate_news.py
        continue-on-error: true
        timeout-minutes: 8
        env:
          CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
          CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
          GPT_MODEL: deepseek-flash

      - name: Verify serenity research priorities (online)
        # SEC EDGAR + yfinance + news_data：只补证据，不改 skill 的排名。
        run: python scripts/serenity_verify.py
        continue-on-error: true
        timeout-minutes: 6

      - name: Fetch market indicators (flag-gated)
        # F&G + FedWatch：flag 关（vars.ENABLE_MARKET_INDICATORS 未设）时整个步骤跳过，
        # dashboard_export 读不到 market_indicators.json → payload 不含该键 → 前端板块隐藏，
        # 与现在逐字节一致。flag 开时落盘 dashboard/data/market_indicators.json（单源失败→null）。
        # continue-on-error：即使抓取全部失败也不拖垮整体刷新（两源都失败时不写文件，R1）。
        if: env.ENABLE_MARKET_INDICATORS == '1'
        run: python dashboard/fetch_market_indicators.py
        continue-on-error: true

      - name: Run dashboard_export.py
        id: export
        env:
          # Pass workflow_dispatch input through the environment; never interpolate
          # user-controlled input into shell source.
          INPUT_KLINE_BARS: ${{ github.event.inputs.kline_bars }}
          INPUT_NO_STOOQ: ${{ github.event.inputs.no_stooq }}
        run: |
          mkdir -p dashboard/data
          ARGS=(--data-dir . --out dashboard/data/dashboard_data.json --timeout 20 --retries 3)
          if [[ -n "${INPUT_KLINE_BARS:-}" ]]; then
            if [[ ! "${INPUT_KLINE_BARS}" =~ ^[1-9][0-9]{0,3}$ ]]; then
              echo "::error::kline_bars must be a positive integer no greater than 9999"
              exit 2
            fi
            ARGS+=(--kline-bars "${INPUT_KLINE_BARS}")
          fi
          case "${INPUT_NO_STOOQ:-false}" in
            true) ARGS+=(--no-stooq) ;;
            false|"") ;;
            *)
              echo "::error::no_stooq must be true or false"
              exit 2
              ;;
          esac
          ARGS+=(--runtimes dashboard/data/runtimes.json)
          # The default Actions shell enables -e but not necessarily pipefail.
          # Capture both pipeline statuses so a failed Python exporter cannot be hidden
          # by a successful tee process.
          set +e
          python dashboard_export.py "${ARGS[@]}" 2>&1 | tee dashboard/data/last_run.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          exporter_status="${pipeline_status[0]:-1}"
          tee_status="${pipeline_status[1]:-1}"
          echo "exporter_exit=${exporter_status} tee_exit=${tee_status}"
          if [ "${exporter_status}" -ne 0 ]; then
            echo "::error::dashboard_export.py failed with exit code ${exporter_status}"
            exit "${exporter_status}"
          fi
          if [ "${tee_status}" -ne 0 ]; then
            echo "::error::tee failed to persist dashboard_export logs"
            exit "${tee_status}"
          fi

      - name: Summarize run
        run: |
          python dashboard/summarize_run.py \
            dashboard/data/dashboard_data.json \
            dashboard/data/last_run.json || true

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, sys
          p = "dashboard/data/dashboard_data.json"
          try:
              d = json.load(open(p, encoding="utf-8"))
          except Exception as e:
              print(f"::error::JSON 解析失败：{e}")
              sys.exit(1)
          for k in ("stocks", "market", "options", "review", "history", "meta"):
              if k not in d:
                  print(f"::error::缺少顶层字段 {k}")
                  sys.exit(1)
          if not d["stocks"]:
              # 无 pending CSV 时会复用上一版 dashboard_data.json 的名单；两者都没有才为空
              pending = (d.get("meta") or {}).get("pending_csv")
              src = (d.get("meta") or {}).get("stocks_source")
              if pending:
                  print(f"::error::stocks 为空，但 pending_csv={pending}")
                  sys.exit(1)
              print(f"::warning::stocks 为空数组（pending CSV 与上一版 JSON 均不可用，stocks_source={src}），属预期状态")
          c = d["meta"].get("counts", {})
          print(f"[validate] stocks={len(d['stocks'])} "
                f"market={c.get('market_available')}/{c.get('market_total')} "
                f"kline_ok={c.get('kline_ok')} technical_ok={c.get('technical_ok')} "
                f"price_live={c.get('price_live')}")
          if c.get("market_available", 0) == 0:
              print("::warning::本次未取得任何全球市场行情（Yahoo 可能被阻断），JSON 中为 null 且记录真实 error")
          print("JSON 校验通过")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只提交正式 Dashboard 数据文件。绝不 git add . / git add -A，
          # 也不提交已停止维护的旧前端 us-market-terminal/（导出层默认已不再产生该副本）。
          git add dashboard/data/dashboard_data.json dashboard/data/last_run.json dashboard/data/last_run.log portfolio_50000_positions.csv
          if [ -f portfolio_50000_transactions.csv ]; then git add portfolio_50000_transactions.csv; fi
          # 盘中止损卖出后必须同步权益快照（Cash / Total_Equity / Open_Positions），
          # 否则下一次 checkout 回到旧 history，Dashboard 仍会显示假亏损。
          if [ -f portfolio_50000_history.csv ]; then git add portfolio_50000_history.csv; fi
          # 成交时刻侧车：盘中止损与本轮价格刷新可能追加成交时刻，必须一并入库，
          # 否则 Dashboard 的买入/卖出时刻会在下次 checkout 后丢失。
          if [ -f portfolio_50000_txn_time.csv ]; then git add portfolio_50000_txn_time.csv; fi
          # 市场情绪指标：仅 flag 开且至少一源成功才会落盘该文件；flag 关时不出现，git add 需先判存在。
          if [ -f dashboard/data/market_indicators.json ]; then git add dashboard/data/market_indicators.json; fi
          # 超跌观察候选：规则版筛选每次刷新重写；文件不存在时跳过。
          if [ -f dashboard/data/oversold_candidates.json ]; then git add dashboard/data/oversold_candidates.json; fi
          if [ -f dashboard/data/macro_indicators.json ]; then git add dashboard/data/macro_indicators.json; fi
          if [ -f dashboard/data/macro_cpi_ai.json ]; then git add dashboard/data/macro_cpi_ai.json; fi
          if [ -f dashboard/data/serenity_verified.json ]; then git add dashboard/data/serenity_verified.json; fi
          if [ -f dashboard/data/news_translations.json ]; then git add dashboard/data/news_translations.json; fi
          if [ -f dashboard/data/news_data.json ]; then git add dashboard/data/news_data.json; fi
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          # 提交范围守卫：出现非预期路径立即失败，避免把无关文件带入 main
          STAGED="$(git diff --cached --name-only)"
          echo "待提交文件："
          echo "$STAGED"
          if echo "$STAGED" | grep -vE '^(dashboard/data/(dashboard_data\.json|last_run\.json|last_run\.log|market_indicators\.json|oversold_candidates\.json|macro_indicators\.json|macro_cpi_ai\.json|news_data\.json|news_translations\.json|serenity_verified\.json)|portfolio_50000_positions\.csv|portfolio_50000_transactions\.csv|portfolio_50000_txn_time\.csv|portfolio_50000_history\.csv)$'; then
            echo "::error::检测到非预期文件进入提交范围，已中止提交"
            exit 1
          fi
          git commit -m "chore(dashboard): refresh market data [skip ci]"
          # 与并发运行撞车时的重试：
          #   · 先 fetch 最新 origin/main，绝不使用陈旧远端基准
          #   · 用 reset --soft 让本轮「已生成的数据」重新成为工作区改动并提交到最新 main 之上
          #   · 不使用 git pull --rebase —— 两次运行写同一 JSON，rebase 重放必然行级冲突
          #   · 不使用任何 force push
          PUSHED=0
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "push succeeded (attempt $i)"
                exit 0
              fi
            else
              # 并发撞车：rebase 行级冲突 → 放弃 rebase，改用 reset --soft 重放
              git rebase --abort 2>/dev/null || true
              echo "rebase conflict, using reset --soft replay (attempt $i)"
              git reset --soft origin/main
              # reset --soft 会保留「陈旧 checkout」的索引：若本轮运行期间 main 上
              # 有了 UI/代码变更（如 app.js / index.html），直接用该索引提交会把它们
              # 回退掉。这里只保留本轮数据文件，其它路径一律恢复成 origin/main 版本。
              for f in $(git diff --cached --name-only); do
                case "$f" in
                  dashboard/data/dashboard_data.json|dashboard/data/last_run.json|dashboard/data/last_run.log|dashboard/data/market_indicators.json|dashboard/data/oversold_candidates.json|dashboard/data/macro_indicators.json|dashboard/data/macro_cpi_ai.json|dashboard/data/news_data.json|dashboard/data/news_translations.json|dashboard/data/serenity_verified.json|portfolio_50000_positions.csv|portfolio_50000_transactions.csv|portfolio_50000_txn_time.csv|portfolio_50000_history.csv)
                    ;;
                  *)
                    git checkout origin/main -- "$f" 2>/dev/null || true
                    ;;
                esac
              done
              git commit -m "chore(dashboard): refresh market data [skip ci]" || true
              if git push origin HEAD:main; then
                echo "push succeeded via reset --soft (attempt $i)"
                exit 0
              fi
            fi
            echo "push failed (attempt $i), retrying..."
            sleep 5
          done
          exit 1
          if [ "$PUSHED" = "1" ]; then
            echo "Dashboard 数据已提交并推送"
          else
            echo "::error::重试 3 次后仍无法推送；本轮已生成的数据保留在工作区，未回退、未覆盖远端"
            echo "::error::待提交快照："
            git diff --cached --stat || true
            exit 1
          fi
