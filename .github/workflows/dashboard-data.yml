name: Dashboard Data Refresh

# ============================================================
# 这个 Workflow 只做一件事：运行 dashboard_export.py，刷新 dashboard_data.json。
#
# 【明确不做】
#   · 不运行 scan.py，不触发任何选股 / 评分 / 止损 / Review / Options 逻辑
#   · 不调用 GPT / Claude / Gemini 或任何 AI API（AI 六段由 scan.py 独立产出）
#   · 不读取、不写入任何 API Key；不伪造、不硬编码任何行情数值
# ============================================================

on:
  schedule:
    # 工作日 24 小时每 15 分钟刷新（周一~周五全天），确保宏观资产在亚洲时段也持续更新
    # 注意：GitHub cron 最短间隔为 5 分钟，高峰期可能延迟或跳跑。
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
    inputs:
      kline_bars:
        description: "K 线保留的完整交易日数量"
        required: false
        default: "180"
      no_stooq:
        description: "禁用 Stooq 备用源（true/false）"
        required: false
        default: "false"
  push:
    paths:
      - dashboard_export.py
      - dashboard/summarize_run.py
      - .github/workflows/dashboard-data.yml

permissions:
  contents: write

concurrency:
  group: dashboard-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 明确声明：本 Workflow 与 AI 无关，仅作审计留痕
      DASHBOARD_AI_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ! pip install -r requirements-dashboard.txt; then
            echo "::warning::依赖安装失败，dashboard_export.py 将自动降级到内置 HTTP / Stooq 源"
          fi
          python -c "import yfinance,sys;print('yfinance', yfinance.__version__)" \
            || echo "::warning::yfinance 不可用，将使用 Yahoo HTTP / Stooq 降级路径"

      - name: Run dashboard_export.py
        id: export
        run: |
          mkdir -p dashboard/data
          ARGS="--data-dir . --out dashboard/data/dashboard_data.json --timeout 20 --retries 3"
          if [ "${{ github.event.inputs.kline_bars }}" != "" ]; then
            ARGS="$ARGS --kline-bars ${{ github.event.inputs.kline_bars }}"
          fi
          if [ "${{ github.event.inputs.no_stooq }}" = "true" ]; then
            ARGS="$ARGS --no-stooq"
          fi
          python dashboard_export.py $ARGS 2>&1 | tee dashboard/data/last_run.log
          echo "exit=${PIPESTATUS[0]}"

      - name: Summarize run
        run: |
          python dashboard/summarize_run.py \
            dashboard/data/dashboard_data.json \
            dashboard/data/last_run.json || true

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, sys
          p = "dashboard/data/dashboard_data.json"
          try:
              d = json.load(open(p, encoding="utf-8"))
          except Exception as e:
              print(f"::error::JSON 解析失败：{e}")
              sys.exit(1)
          for k in ("stocks", "market", "options", "review", "history", "meta"):
              if k not in d:
                  print(f"::error::缺少顶层字段 {k}")
                  sys.exit(1)
          if not d["stocks"]:
              # 无 pending CSV 时会复用上一版 dashboard_data.json 的名单；两者都没有才为空
              pending = (d.get("meta") or {}).get("pending_csv")
              src = (d.get("meta") or {}).get("stocks_source")
              if pending:
                  print(f"::error::stocks 为空，但 pending_csv={pending}")
                  sys.exit(1)
              print(f"::warning::stocks 为空数组（pending CSV 与上一版 JSON 均不可用，stocks_source={src}），属预期状态")
          c = d["meta"].get("counts", {})
          print(f"[validate] stocks={len(d['stocks'])} "
                f"market={c.get('market_available')}/{c.get('market_total')} "
                f"kline_ok={c.get('kline_ok')} technical_ok={c.get('technical_ok')} "
                f"price_live={c.get('price_live')}")
          if c.get("market_available", 0) == 0:
              print("::warning::本次未取得任何全球市场行情（Yahoo 可能被阻断），JSON 中为 null 且记录真实 error")
          print("JSON 校验通过")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/dashboard_data.json dashboard/data/last_run.json dashboard/data/last_run.log
          if [ -d us-market-terminal/dashboard/data ]; then
            git add us-market-terminal/dashboard/data/dashboard_data.json
          fi
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(dashboard): refresh market data [skip ci]"
            git push
          fi
