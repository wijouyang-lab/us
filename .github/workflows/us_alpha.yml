name: US Alpha Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'
    - cron: '0 22 * * 1-5'

jobs:
  run-quant:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        # 🌟 关键修复：直接升级到 Python 3.11，完美兼容最新版 pandas 库
        python-version: '3.11'
        
    - name: Install Libs
      # 🌟 关键修复：恢复标准的 pandas-ta 安装名 (安装用连字符，代码里 import 用下划线)
      run: pip install pandas pandas-ta requests google-genai
      
    - name: ⏱️ Run Script Based on Time
      env:
        FMP_KEY_1: ${{ secrets.FMP_KEY_1 }}
        FMP_KEY_2: ${{ secrets.FMP_KEY_2 }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        CURRENT_HOUR=$(date +'%H')
        if [ "$CURRENT_HOUR" -ge 10 ] && [ "$CURRENT_HOUR" -le 16 ]; then
          echo "🌙 触发【盘前选股】引擎 (北京时间 20:00)..."
          python scan.py
        else
          echo "🌅 触发【盘后复盘】引擎 (北京时间 06:00)..."
          python review.py || true
        fi
      
    - name: 💾 Save Logs & Sync to GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Alpha Bot"
        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto update quant logs"
        git push
