name: US Alpha Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 1-5'

jobs:
  run-quant:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Libs
      run: pip install pandas pandas-ta requests google-genai
      
    - name: Run US Scan & Options Board
      env:
        # 👇 把所有的钥匙全从保险箱里拿出来，绝对不留明文
        FMP_KEY_1: ${{ secrets.FMP_KEY_1 }}
        FMP_KEY_2: ${{ secrets.FMP_KEY_2 }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: python scan.py
      
    - name: Save Log & HTML
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Alpha Bot"
        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto update US scan log"
        git push
