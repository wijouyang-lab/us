name: US-Share Alpha Radar

on:
  workflow_dispatch:
  schedule:
    # 任务1: 美股盘前选股 (北京时间 20:00，UTC 12:00)
    - cron: '0 12 * * 1-5'
    # 任务2: 美股盘后复盘 (北京时间 06:00，UTC 22:00)
    - cron: '0 22 * * 1-5'

jobs:
  run-quant:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Libs
      # 🚀 核心更新：引入了 Tushare 和 Yfinance
      run: pip install pandas pandas-ta requests google-genai tushare yfinance

    - name: ⏱️ Run Script Based on Time (智能分流)
      env:
        # 🚀 核心更新：引入了 TUSHARE_TOKEN
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
      run: |
        echo "🌙 临时强制触发【盘前选股】引擎..."
        python scan.py
    - name: 💾 Save Logs & Sync to GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Alpha Bot"
        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto update US-share logs"
        git push
