name: US-Share Alpha Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'   # 美股盘前选股
    - cron: '0 22 * * 1-5'   # 美股盘后复盘
    - cron: '0 11 * * 5'     # 每周五 UTC 11:00 触发进化

jobs:
  run-quant:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Libs
      run: pip install pandas pandas-ta requests anthropic tushare

    - name: ⏱️ Run Script Based on Time (智能分流)
      env:
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
        CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
        FMP_KEY_1: ${{ secrets.FMP_KEY_1 }}
        FMP_KEY_2: ${{ secrets.FMP_KEY_2 }}
        EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
      run: |
        CURRENT_HOUR=$(date +'%H')
        CURRENT_DAY=$(date +'%u')
        if [ "$CURRENT_HOUR" -ge 11 ] && [ "$CURRENT_HOUR" -le 15 ]; then
          echo "🌙 触发【盘前选股】引擎..."
          python scan.py
        elif [ "$CURRENT_DAY" -eq 5 ] && [ "$CURRENT_HOUR" -eq 11 ]; then
          echo "🧬 触发【美股自动进化】引擎..."
          python evolve_us.py
        else
          echo "🌅 触发【盘后复盘】引擎..."
          python review.py || true
        fi

    - name: 💾 Save Logs & Sync to GitHub
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "Alpha Bot"
        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "🧬 Auto evolve US scan.py"
        git push
