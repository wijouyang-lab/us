name: US-Share Alpha Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'
    - cron: '0 22 * * 1-5'
    - cron: '0 11 * * 5'

jobs:
  run-quant:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Libs
      run: pip install pandas pandas-ta requests anthropic tushare

    - name: Run Script
      env:
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
        CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
        FMP_KEY_1: ${{ secrets.FMP_KEY_1 }}
        FMP_KEY_2: ${{ secrets.FMP_KEY_2 }}
        EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
      run: |
        CURRENT_HOUR=$(date +'%H')
        CURRENT_DAY=$(date +'%u')
        if [ "$CURRENT_HOUR" -ge 12 ] && [ "$CURRENT_HOUR" -le 21 ]; then
          echo "Scan"
          python scan.py
        elif [ "$CURRENT_DAY" -eq 5 ] && [ "$CURRENT_HOUR" -ge 9 ] && [ "$CURRENT_HOUR" -le 11 ]; then
          echo "Evolve"
          python evolve.py
        else
          echo "Review"
          python review.py || true
        fi

    - name: Save Logs
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "Alpha Bot"
        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto update US logs"
        git push
