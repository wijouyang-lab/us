name: US Alpha Radar

on:
  workflow_dispatch:
  schedule:
    # 任务1：美股盘前选股 (北京时间 20:00，对应 UTC 12:00, 周一至周五)
    - cron: '0 12 * * 1-5'
    # 任务2：美股盘后复盘 (北京时间 06:00，对应 UTC 22:00, 周一至周五)
    # 注意: UTC时间的周一到周五晚上22点，正好是北京时间的周二到周六早上6点！(完美覆盖美股收盘后)
    - cron: '0 22 * * 1-5'

jobs:
  run-quant:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Libs
      run: pip install pandas pandas-ta requests google-genai
      
    - name: ⏱️ Run Script Based on Time (智能分流)
      env:
        FMP_KEY_1: ${{ secrets.FMP_KEY_1 }}
        FMP_KEY_2: ${{ secrets.FMP_KEY_2 }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        # 获取当前的 UTC 小时 (00-23)
        CURRENT_HOUR=$(date +'%H')
        
        # 逻辑判断：如果 UTC 时间在 10点~16点之间 (即北京时间 18:00~00:00)，跑选股！
        if [ "$CURRENT_HOUR" -ge 10 ] && [ "$CURRENT_HOUR" -le 16 ]; then
          echo "🌙 触发【盘前选股】引擎 (北京时间 20:00)..."
          python scan.py
          
        # 其他时间 (包括早上 6 点)，跑复盘！
        else
          echo "🌅 触发【盘后复盘】引擎 (北京时间 06:00)..."
          python review.py || true
        fi
      
    - name: 💾 Save Logs & Sync to GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Alpha Bot"
        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto update quant logs"
        git push
