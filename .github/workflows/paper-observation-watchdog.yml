name: Paper Trading Observation Watchdog

on:
  schedule:
    # Run after the expected US-market-day Scan and post-close Paper Trading window.
    - cron: "45 23 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: paper-observation-watchdog
  cancel-in-progress: false

jobs:
  check-observation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the 40-day observation gate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "[Paper Trading] 40-day observation gate not advancing";
            const now = new Date();
            const etDate = (date) => new Intl.DateTimeFormat("en-CA", {
              timeZone: "America/New_York",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
            }).format(date);
            const todayET = etDate(now);

            let observationRows = [];
            let observationFileState = "missing";
            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo, path: "portfolio_paper_observation_dates.csv", ref: "main",
              });
              if (Array.isArray(data) || data.type !== "file" || !data.content) {
                throw new Error("Observation path is not a readable file");
              }
              const decoded = Buffer.from(data.content, "base64").toString("utf8").trim();
              const lines = decoded ? decoded.split(/\r?\n/) : [];
              if (lines.length > 1) {
                const headers = lines[0].split(",");
                const dateIndex = headers.indexOf("Run_Date");
                if (dateIndex < 0) throw new Error("Run_Date column is missing");
                observationRows = lines.slice(1).filter(Boolean).map(line => {
                  const fields = line.split(",");
                  return { Run_Date: (fields[dateIndex] || "").trim() };
                }).filter(row => /^\d{4}-\d{2}-\d{2}$/.test(row.Run_Date));
              }
              observationFileState = "readable";
            } catch (error) {
              if (error.status !== 404) {
                core.warning(`Could not read observation file: ${error.message}`);
                observationFileState = "read-error";
              }
            }

            const dates = [...new Set(observationRows.map(row => row.Run_Date))].sort();
            const latestObservationDate = dates.at(-1) || null;
            const ageDays = latestObservationDate
              ? Math.floor((Date.parse(todayET + "T00:00:00Z") - Date.parse(latestObservationDate + "T00:00:00Z")) / 86400000)
              : null;

            const { data: scanData } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: "scan.yml", branch: "main", per_page: 30,
            });
            const scanRuns = (scanData.workflow_runs || [])
              .filter(run => run.head_branch === "main" && run.event === "workflow_dispatch")
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const latestSuccessfulScan = scanRuns.find(run => run.conclusion === "success") || null;
            const latestScanDate = latestSuccessfulScan ? etDate(new Date(latestSuccessfulScan.created_at)) : null;

            // The counter advances only after a successful Scan-triggered Paper Trading run
            // with fresh enough price history. A manual Paper Trading dispatch is not an observation.
            const stale = observationFileState === "read-error"
              || dates.length === 0
              || ageDays === null
              || ageDays > 4
              || Boolean(latestScanDate && (!latestObservationDate || latestScanDate > latestObservationDate));

            const body = [
              "The Paper Trading 40-day evaluation gate advances only when a successful Scan triggers Paper Trading and the price history passes its freshness check.",
              "",
              `Checked (ET): ${todayET}`,
              `Observation file: ${observationFileState}`,
              `Recorded valid observation dates: ${dates.length}`,
              `Latest observation date: ${latestObservationDate || "none"}`,
              `Observation age in calendar days: ${ageDays === null ? "N/A" : ageDays}`,
              `Latest successful Scan date (ET): ${latestScanDate || "none"}`,
              latestSuccessfulScan ? `Latest successful Scan run: ${latestSuccessfulScan.html_url}` : "Latest successful Scan run: none found in the latest 30 dispatch runs",
              "",
              "This watchdog does not create observations or execute trades. It only flags a stalled/missing observation log so the 40-day gate cannot silently appear to progress.",
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);

            if (stale) {
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
                core.warning(`Observation gate is stalled; updated issue #${existing.number}`);
              } else {
                const { data: issue } = await github.rest.issues.create({ owner, repo, title, body });
                core.warning(`Observation gate is stalled; opened issue #${issue.number}`);
              }
            } else if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: "closed",
                body: body + "\n\nRecovered: recent valid observation records are present.",
              });
              core.info(`Observation gate recovered; closed issue #${existing.number}`);
            } else {
              core.info(`Observation gate healthy: ${dates.length} recorded dates; latest=${latestObservationDate}`);
            }
