name: Quant Fix Regression Tests

on:
  push:
    branches:
      - fix/quant-price-session-date-integrity
    paths:
      - "scan.py"
      - "portfolio_50000.py"
      - "tests/test_portfolio_intraday_stop.py"
      - "tests/test_intraday_stop.py"
      - "tests/test_buy_cooldown.py"
      - "tests/test_dashboard_workflow_branch_guard.py"
      - "tests/test_date_integrity_audit.py"
      - "tests/test_price_history_repair_plan.py"
      - "tools/research/audit_date_integrity.py"
      - "tools/research/plan_price_history_repair.py"
      - ".github/workflows/dashboard-data.yml"
      - "tests/test_scan_daily_date_contract.py"
      - "quant_factor_lab.py"
      - "tests/test_quant_factor_lab.py"
      - "dashboard_export.py"
      - "scripts/ai_coverage.py"
      - "tests/test_ai_coverage.py"
      - "quant_factor_price.py"
      - "quant_factor_backtest.py"
      - "tests/test_quant_factor_backtest.py"
      - "quant_research_runner.py"
      - "tests/test_quant_research_runner.py"
      - "tests/test_quant_price_history_schema_guard.py"
      - "scripts/paper_trading.py"
      - "scripts/paper_trading_report.py"
      - "tools/research/atr_position_sizing.py"
      - "tools/research/oos_momentum_factor_screen.py"
      - "tests/test_oos_momentum_factor_screen.py"
      - "tools/research/turnover_and_cost_analysis.py"
      - "tests/test_quant_factor_price.py"
      - "tests/test_paper_trading.py"
      - "tests/test_paper_trading_schedule.py"
      - "scripts/paper_trading_schedule.py"
      - "tests/test_ai_item_matching.py"
      - "scripts/ai_item_matching.py"
      - "tests/test_ai_explanation_wiring.py"
      - "tests/test_paper_trading_report.py"
      - "tests/test_atr_position_sizing.py"
      - "tests/test_turnover_cost_analysis.py"
      - ".github/workflows/quant-fix-tests.yml"
      - ".github/workflows/paper-trading.yml"
      - ".github/workflows/rebuild-quant-price-history.yml"
  pull_request:
    paths:
      - "scan.py"
      - "portfolio_50000.py"
      - "tests/test_portfolio_intraday_stop.py"
      - "tests/test_intraday_stop.py"
      - "tests/test_buy_cooldown.py"
      - "tests/test_dashboard_workflow_branch_guard.py"
      - "tests/test_date_integrity_audit.py"
      - "tests/test_price_history_repair_plan.py"
      - "tools/research/audit_date_integrity.py"
      - "tools/research/plan_price_history_repair.py"
      - ".github/workflows/dashboard-data.yml"
      - "tests/test_scan_daily_date_contract.py"
      - "quant_factor_lab.py"
      - "tests/test_quant_factor_lab.py"
      - "dashboard_export.py"
      - "scripts/ai_coverage.py"
      - "tests/test_ai_coverage.py"
      - "quant_factor_price.py"
      - "quant_factor_backtest.py"
      - "tests/test_quant_factor_backtest.py"
      - "quant_research_runner.py"
      - "tests/test_quant_research_runner.py"
      - "tests/test_quant_price_history_schema_guard.py"
      - "scripts/paper_trading.py"
      - "scripts/paper_trading_report.py"
      - "tools/research/atr_position_sizing.py"
      - "tools/research/oos_momentum_factor_screen.py"
      - "tests/test_oos_momentum_factor_screen.py"
      - "tools/research/turnover_and_cost_analysis.py"
      - "tests/test_quant_factor_price.py"
      - "tests/test_paper_trading.py"
      - "tests/test_paper_trading_schedule.py"
      - "scripts/paper_trading_schedule.py"
      - "tests/test_ai_item_matching.py"
      - "scripts/ai_item_matching.py"
      - "tests/test_ai_explanation_wiring.py"
      - "tests/test_paper_trading_report.py"
      - "tests/test_atr_position_sizing.py"
      - "tests/test_turnover_cost_analysis.py"
      - ".github/workflows/quant-fix-tests.yml"
      - ".github/workflows/paper-trading.yml"
      - ".github/workflows/rebuild-quant-price-history.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-fix-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-production.txt

      - name: Install production and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.txt
          python -m pip install pytest

      - name: Compile modified Python modules
        run: |
          python -m py_compile scan.py portfolio_50000.py dashboard_export.py scripts/ai_coverage.py quant_factor_price.py quant_factor_backtest.py tests/test_quant_factor_backtest.py quant_research_runner.py scripts/paper_trading.py scripts/paper_trading_schedule.py scripts/ai_item_matching.py scripts/paper_trading_report.py tools/research/atr_position_sizing.py tools/research/turnover_and_cost_analysis.py tools/research/audit_date_integrity.py tools/research/plan_price_history_repair.py tests/test_dashboard_workflow_branch_guard.py tests/test_date_integrity_audit.py tests/test_price_history_repair_plan.py tests/test_intraday_stop.py tests/test_buy_cooldown.py tests/test_quant_factor_price.py tests/test_paper_trading.py tests/test_paper_trading_report.py tests/test_atr_position_sizing.py tests/test_turnover_cost_analysis.py

      - name: Test quant factor backtest and summary validity
        run: python -m pytest tests/test_quant_factor_backtest.py -q

      - name: Test paper portfolio intraday stop
        run: python -m pytest tests/test_portfolio_intraday_stop.py -q

      - name: Test stop-loss scheduling, quote freshness, and repair-plan safety
        run: |
          python -m pytest -q \
            tests/test_portfolio_intraday_stop.py \
            tests/test_intraday_stop.py \
            tests/test_buy_cooldown.py \
            tests/test_dashboard_workflow_branch_guard.py \
            tests/test_date_integrity_audit.py \
            tests/test_price_history_repair_plan.py

      - name: Test Scan daily session-date contract
        run: python tests/test_scan_daily_date_contract.py

      - name: Test Quant Factor Lab date contract
        run: python tests/test_quant_factor_lab.py

      - name: Read-only audit of mixed legacy price history
        run: |
          python tools/research/plan_price_history_repair.py > /tmp/price_history_repair_summary.json
          cat /tmp/price_history_repair_summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/price_history_repair_summary.json").read_text(encoding="utf-8"))
          assert result["read_only"] is True
          assert result["input_mutated"] is False
          assert result["automatic_repair_performed"] is False
          assert result["close_mismatches"] == 0, result.get("classifications")
          print(
              "[repair-plan audit] rows=%s legacy=%s references=%s close_mismatch=%s"
              % (
                  result["rows_in_input"],
                  result["legacy_schema_rows_planned"],
                  result["legacy_rows_with_v2_reference_at_proposed_date"],
                  result["close_mismatches"],
              )
          )
          PY

      - name: Test price history date contract
        run: python tests/test_quant_factor_price.py

      - name: Test Phase 2 direct-entry schema guard
        run: python tests/test_quant_price_history_schema_guard.py

      - name: Test research-runner mixed-schema guard
        run: python tests/test_quant_research_runner.py

      - name: Test paper trading execution and costs
        run: python tests/test_paper_trading.py

      - name: Test DST-safe paper trading schedule gate
        run: python tests/test_paper_trading_schedule.py

      - name: Test AI explanation ticker matching
        run: python tests/test_ai_item_matching.py

      - name: Test AI explanation wiring and diagnostics
        run: python tests/test_ai_explanation_wiring.py

      - name: Test Dashboard event-level AI coverage
        run: python tests/test_ai_coverage.py

      - name: Test paper report schema guard
        run: python tests/test_paper_trading_report.py

      - name: Test ATR research metrics and cost accounting
        run: python tests/test_atr_position_sizing.py

      - name: Test PIT sector and attribution guards
        run: python tests/test_turnover_cost_analysis.py

      - name: Test chronological OOS factor screen
        run: python tests/test_oos_momentum_factor_screen.py

      - name: Generate held-out PIT momentum screen (research only)
        run: |
          python tools/research/oos_momentum_factor_screen.py
          grep -q "Test-set interpretation" docs/OOS_MOMENTUM_FACTOR_SCREEN.md
          cat docs/OOS_MOMENTUM_FACTOR_SCREEN.md

      - name: Generate cost-aware ATR report (integration check)
        run: |
          python tools/research/atr_position_sizing.py
          grep -q "平均单期 20D 净收益" docs/ATR_POSITION_SIZING.md
          grep -q "非重叠 20D 期累计净复利" docs/ATR_POSITION_SIZING.md
          grep -q "交易成本敏感性" docs/ATR_POSITION_SIZING.md
          if grep -q "20D 前瞻重叠.*夏普高估" docs/ATR_POSITION_SIZING.md; then
            echo "::error::ATR report still labels the non-overlapping estimate as overlap-inflated Sharpe"
            exit 1
          fi
          if grep -q "未扣成本" docs/ATR_POSITION_SIZING.md; then
            echo "::error::ATR report still advertises a gross-only result as if it were net"
            exit 1
          fi
          cat docs/ATR_POSITION_SIZING.md

      - name: Generate PIT-gated death-autopsy report (integration check)
        run: |
          python tools/research/turnover_and_cost_analysis.py
          grep -q "不计算行业轮动毛/净收益" docs/DEATH_AUTOPSY.md
          grep -q "log(Price)" docs/DEATH_AUTOPSY.md
          cat docs/DEATH_AUTOPSY.md

      - name: Generate paper report (integration check)
        run: |
          python scripts/paper_trading_report.py
          cat docs/PAPER_TRADING_REPORT.md
