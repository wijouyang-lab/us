name: Non-ATR Research Utility Tests

on:
  pull_request:
    paths:
      - "tools/research/non_atr_robustness_report.py"
      - "tools/research/non_atr_cost_sensitivity.py"
      - "tools/research/non_atr_portfolio_backtest.py"
      - "tests/test_non_atr_robustness_report.py"
      - "tests/test_non_atr_cost_sensitivity.py"
      - "tests/test_non_atr_portfolio_backtest.py"
      - ".github/workflows/non-atr-robustness-tests.yml"
  push:
    branches:
      - "research/non-atr-integrated-backtest"
    paths:
      - "tools/research/non_atr_robustness_report.py"
      - "tools/research/non_atr_cost_sensitivity.py"
      - "tools/research/non_atr_portfolio_backtest.py"
      - "tests/test_non_atr_robustness_report.py"
      - "tests/test_non_atr_cost_sensitivity.py"
      - "tests/test_non_atr_portfolio_backtest.py"
      - ".github/workflows/non-atr-robustness-tests.yml"

permissions:
  contents: read

jobs:
  research-utility-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install pandas pytest
      - name: Compile research utilities
        run: |
          python -m py_compile             tools/research/non_atr_cost_sensitivity.py             tools/research/non_atr_portfolio_backtest.py
      - name: Test research reports, costs, and portfolio weights
        run: |
          python -m pytest -q             tests/test_non_atr_robustness_report.py             tests/test_non_atr_cost_sensitivity.py             tests/test_non_atr_portfolio_backtest.py
