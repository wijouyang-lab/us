name: Research Non-ATR Backtests

on:
  push:
    branches:
      - "research/non-atr-*"
    paths:
      - "tools/research/non_atr_*.py"
      - "tests/test_non_atr_*.py"
      - ".github/workflows/research-non-atr-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/research/non_atr_*.py"
      - "tests/test_non_atr_*.py"
      - ".github/workflows/research-non-atr-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install "pandas>=2.2,<4" pytest
      - name: Run non-ATR research tests
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pytest -q \
            tests/test_non_atr_strategy_baselines.py \
            tests/test_non_atr_validation.py \
            tests/test_non_atr_integrated_backtest.py
